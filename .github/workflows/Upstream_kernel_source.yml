name: "Upstream Kernel Source"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "URL repo upstream (contoh: https://android.googlesource.com/kernel/common)"
        required: false
        type: string
        default: "https://android.googlesource.com/kernel/common"
      source_branch:
        description: "Branch upstream (contoh: android13-5.15-lts)"
        required: false
        type: string
        default: "android13-5.15-lts"
      target_branch:
        description: "Branch target di repo ini"
        required: false
        type: string
        default: "android13-5.15-lts"
      sync_mode:
        description: "merge = gabung upstream, riwayat & commit kustom Anda tetap | mirror = samakan dengan upstream (shallow, force push) | fresh = salin SELURUH riwayat upstream (force push, bertahap)"
        required: true
        type: choice
        default: "merge"
        options:
          - "merge"
          - "mirror"
          - "fresh"
      conflict_strategy:
        description: "Khusus mode merge bila ada konflik: abort = berhenti | ours = menangkan kode Anda | theirs = menangkan upstream"
        required: true
        type: choice
        default: "abort"
        options:
          - "abort"
          - "ours"
          - "theirs"
  # Aktifkan bila ingin sinkron otomatis (memakai nilai default di atas):
  # schedule:
  #   - cron: "0 19 * * 5"

permissions:
  contents: write
  
jobs:
  upstream:
    name: "🔄 Upstream Kernel Source"
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      SOURCE_REPO: ${{ inputs.source_repo || 'https://android.googlesource.com/kernel/common' }}
      SOURCE_BRANCH: ${{ inputs.source_branch || 'android13-5.15-lts' }}
      TARGET_REPO: ${{ github.repository }}
      TARGET_BRANCH: ${{ inputs.target_branch || 'android13-5.15-lts' }}
      SYNC_MODE: ${{ inputs.sync_mode || 'merge' }}
      CONFLICT_STRATEGY: ${{ inputs.conflict_strategy || 'abort' }}
      PUSH_TOKEN: ${{ github.token }}
    steps:
      - name: "🧹 Bebaskan ruang disk (untuk kernel besar)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: 🚧 Setup SWAP 20GB
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 20

      - name: 🔥 Tune Swap
        run: |
          echo "vm.swappiness=85" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: "🔄 Sinkronisasi upstream (${{ inputs.sync_mode || 'merge' }})"
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          # Optimasi koneksi Git untuk mencegah timeout
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 2147483648
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600

          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null || die "Nama branch upstream tidak valid: $SOURCE_BRANCH"
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null || die "Nama branch target tidak valid: $TARGET_BRANCH"

          # owner/repo -> URL GitHub bertoken; path absolut dipakai apa adanya
          case "$TARGET_REPO" in
            /*) TARGET_URL="$TARGET_REPO" ;;
            */*) TARGET_URL="https://x-access-token:${PUSH_TOKEN}@github.com/${TARGET_REPO}.git" ;;
            *) die "target_repo harus berformat username/repo: $TARGET_REPO" ;;
          esac

          OLD="-"; NEW="-"; NOTE=""

          case "$SYNC_MODE" in
            merge)
              git ls-remote --exit-code --heads "$TARGET_URL" "$TARGET_BRANCH" >/dev/null 2>&1 \
                || die "Branch '$TARGET_BRANCH' belum ada di $TARGET_REPO. Jalankan mode 'mirror' sekali untuk membuatnya."

              echo "::group::📥 Clone target & fetch upstream"
              git clone --no-tags --single-branch --branch "$TARGET_BRANCH" "$TARGET_URL" work
              cd work
              git remote add upstream "$SOURCE_REPO"
              git fetch --no-tags upstream "+refs/heads/${SOURCE_BRANCH}:refs/remotes/upstream/${SOURCE_BRANCH}"
              echo "::endgroup::"

              OLD=$(git rev-parse HEAD)
              UP=$(git rev-parse "refs/remotes/upstream/${SOURCE_BRANCH}")

              if git merge-base --is-ancestor "$UP" HEAD; then
                NEW="$OLD"; NOTE="Sudah up-to-date dengan upstream, tidak ada yang digabung."
                echo "✅ $NOTE"
              else
                git merge-base HEAD "$UP" >/dev/null 2>&1 \
                  || die "Riwayat target dan upstream tidak berkaitan (repo dibuat dengan mode 'fresh'?). Pakai mode 'mirror' atau 'fresh'."

                ARGS=(--no-edit -m "Merge upstream ${SOURCE_BRANCH} (${UP:0:12}) dari ${SOURCE_REPO}")
                case "$CONFLICT_STRATEGY" in
                  ours)   ARGS+=(-X ours) ;;
                  theirs) ARGS+=(-X theirs) ;;
                esac

                echo "::group::🔀 Merge upstream"
                if ! git merge "${ARGS[@]}" "$UP"; then
                  echo "::endgroup::"
                  echo "::group::⚠️ File konflik"
                  git diff --name-only --diff-filter=U
                  echo "::endgroup::"
                  git merge --abort || true
                  die "Merge konflik. Ulangi dengan conflict_strategy 'ours' atau 'theirs', atau selesaikan manual."
                fi
                echo "::endgroup::"

                NEW=$(git rev-parse HEAD)
                NOTE="$(git rev-list --count "$OLD..$NEW") commit baru digabung dari upstream."
                echo "::group::🚀 Push (tanpa force)"
                git push "$TARGET_URL" "HEAD:refs/heads/${TARGET_BRANCH}"
                echo "::endgroup::"
              fi
              ;;

            mirror)
              echo "::group::📥 Clone upstream"
              git clone --depth=1 --no-tags --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" work
              cd work
              echo "::endgroup::"
              NEW=$(git rev-parse HEAD)

              # --no-thin: pack berdiri sendiri (tanpa delta ke objek yang "dikira" sudah
              # ada di remote). Penyebab umum "did not receive expected object" pada shallow clone.
              push_mirror() { git push --force --no-thin "$TARGET_URL" "$1:refs/heads/${TARGET_BRANCH}"; }

              echo "::group::🚀 Push paksa (samakan dengan upstream)"
              PUSHED=0
              for try in 1 2 3; do
                if push_mirror HEAD; then PUSHED=1; break; fi
                echo "::warning::Push percobaan ${try}/3 gagal"
                [ "$try" -lt 3 ] && sleep 20
              done

              if [ "$PUSHED" = 1 ]; then
                NOTE="Branch target disamakan persis dengan upstream (force push)."
              else
                # Cadangan: commit tanpa parent dengan tree yang sama. Tidak ada batas shallow
                # yang ikut terkirim, jadi pack lengkap. Isi file identik, hanya hash commit beda.
                echo "::warning::Push biasa gagal 3x, memakai snapshot tanpa parent (isi sama dengan upstream)."
                SRC=$(git rev-parse --short=12 HEAD)
                SNAP=$(git commit-tree "HEAD^{tree}" -m "Mirror: snapshot ${SOURCE_BRANCH}@${SRC} dari ${SOURCE_REPO}")
                push_mirror "$SNAP" || die "Push gagal juga dengan snapshot tanpa parent. Cek ukuran repo / batas GitHub."
                NEW="$SNAP"
                NOTE="Isi branch sama dengan upstream@${SRC}, tetapi sebagai snapshot 1 commit (push biasa gagal)."
              fi
              echo "::endgroup::"
              ;;

            fresh)
              echo "::group::📥 Clone upstream (riwayat lengkap)"
              git clone --no-tags --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" work
              cd work
              echo "::endgroup::"
              NEW=$(git rev-parse HEAD)
              TOTAL=$(git rev-list --count HEAD)

              # Riwayat kernel sangat besar: dorong bertahap (tiap BATCH commit di jalur
              # utama) supaya tiap push kecil dan tidak putus di tengah jalan.
              BATCH="${PUSH_BATCH:-20000}"
              push_ref() {
                local ref="$1" try
                for try in 1 2 3; do
                  if git push --force "$TARGET_URL" "${ref}:refs/heads/${TARGET_BRANCH}"; then return 0; fi
                  echo "::warning::Push ${ref:0:12} gagal (percobaan ${try}/3)"
                  [ "$try" -lt 3 ] && sleep 20
                done
                return 1
              }

              echo "::group::🚀 Push paksa (seluruh riwayat, $TOTAL commit, per $BATCH commit)"
              git rev-list --first-parent --reverse HEAD | awk -v b="$BATCH" 'NR % b == 0' > /tmp/checkpoints.txt
              N=$(wc -l < /tmp/checkpoints.txt); I=0
              while read -r sha; do
                I=$((I + 1)); echo "📦 Bagian ${I}/${N}: ${sha:0:12}"
                push_ref "$sha" || die "Push bagian ${I} gagal 3x."
              done < /tmp/checkpoints.txt
              echo "📦 Bagian akhir: ${NEW:0:12}"
              push_ref "$NEW" || die "Push akhir gagal 3x."
              echo "::endgroup::"
              NOTE="Seluruh riwayat upstream ($TOTAL commit) disalin ke target, force push."
              ;;

            *) die "sync_mode tidak dikenal: $SYNC_MODE" ;;
          esac

          {
            echo "### 🔄 Upstream Kernel Source"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`$SYNC_MODE\` |"
            echo "| Upstream | \`$SOURCE_REPO\` @ \`$SOURCE_BRANCH\` |"
            echo "| Target | \`$TARGET_REPO\` @ \`$TARGET_BRANCH\` |"
            echo "| Sebelum | \`${OLD:0:12}\` |"
            echo "| Sesudah | \`${NEW:0:12}\` |"
            echo ""
            echo "$NOTE"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
