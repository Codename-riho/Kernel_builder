name: "🔍 Check Kernel Config (Kconfig & olddefconfig)"

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base kernel yang dicek (gki = google, clo = codelinaro)"
        type: choice
        options:
          - all
          - gki
          - clo
        default: "all"
      configs:
        description: "Daftar CONFIG_* yang dicek (pisahkan dengan spasi atau koma)"
        type: string
        required: true
        default: "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE CONFIG_KPROFILES CONFIG_TCP_CONG_BBR3 CONFIG_LRU_GEN CONFIG_UCLAMP_TASK CONFIG_CPU_FREQ_GOV_WALT CONFIG_ZRAM_DEF_COMP_LZ4"
      simulate_enable:
        description: "Simulasikan aktifkan (-e) semua config di atas sebelum olddefconfig?"
        type: boolean
        default: false

jobs:
  check-config:
    name: "🔎 Check ${{ matrix.base == 'gki' && 'GKI (google)' || 'CLO (codelinaro)' }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        base: ${{ fromJSON(
          inputs.base == 'gki' && '["gki"]' ||
          inputs.base == 'clo' && '["clo"]' ||
          '["gki","clo"]' ) }}
    env:
      KERNEL_REPO: https://github.com/Codename-riho/Kernel_builder.git
      KERNEL_BRANCH: ${{ matrix.base == 'gki' && 'google' || 'codelinaro' }}
      DEFCONFIG_NAME: gki_defconfig
      CONFIGS_INPUT: ${{ inputs.configs }}
      SIMULATE_ENABLE: ${{ inputs.simulate_enable }}

    steps:
      - name: "📦 Install minimal build tools"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison build-essential clang flex git libelf-dev libssl-dev lld llvm python3

      - name: "📥 Clone kernel source (shallow)"
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel_src

      - name: "⚙️ Generate defconfig & run olddefconfig"
        working-directory: kernel_src
        run: |
          set -euo pipefail
          HOST="HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld HOSTAR=ar"
          make ARCH=arm64 LLVM=1 $HOST O=out "$DEFCONFIG_NAME"

          if [ "$SIMULATE_ENABLE" = "true" ]; then
            echo "🧪 Simulasi mengaktifkan config yang diminta sebelum olddefconfig..."
            for raw in $(printf '%s' "$CONFIGS_INPUT" | tr ',;\n' '   '); do
              sym="${raw#CONFIG_}"
              [[ "$sym" =~ ^[A-Za-z0-9_]+$ ]] || continue
              scripts/config --file out/.config -e "CONFIG_${sym}"
            done
          fi

          make ARCH=arm64 LLVM=1 $HOST O=out olddefconfig

      - name: "🔍 Inspect Kconfig & .config status"
        working-directory: kernel_src
        run: |
          set -euo pipefail
          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG_NAME}"
          OUT_CONFIG="out/.config"
          KVER=$(make -s kernelversion 2>/dev/null || echo "unknown")

          get_status() {
            local file="$1" sym="CONFIG_$2"
            if [ ! -f "$file" ]; then
              echo "—"
            elif grep -qx "${sym}=y" "$file"; then
              echo "✅ \`=y\`"
            elif grep -qx "${sym}=m" "$file"; then
              echo "📦 \`=m\`"
            elif grep -qx "# ${sym} is not set" "$file"; then
              echo "🚫 \`not set\`"
            else
              echo "➖ *(tidak tercantum)*"
            fi
          }

          {
            echo "## 🔍 Hasil Pengecekan Config — \`${{ matrix.base }}\` (\`${KERNEL_BRANCH}\` | v${KVER})"
            echo "- **Mode Simulasi Enable (`-e`):** \`${SIMULATE_ENABLE}\`"
            echo ""
            echo "| Simbol | Ada di Kconfig? | Status \`gki_defconfig\` | Status \`out/.config\` (Resolved) |"
            echo "| :--- | :--- | :--- | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"

          DETAILS_LOG="config_kconfig_details.txt"
          : > "$DETAILS_LOG"

          for raw in $(printf '%s' "$CONFIGS_INPUT" | tr ',;\n' '   '); do
            sym="${raw#CONFIG_}"
            [ -n "$sym" ] || continue
            if ! [[ "$sym" =~ ^[A-Za-z0-9_]+$ ]]; then
              echo "::warning::Format simbol tidak valid, dilewati: $raw"
              continue
            fi

            # Cari definisi simbol di seluruh file Kconfig*
            KCONF_HITS=$(grep -rnE "^[[:space:]]*(menu)?config[[:space:]]+${sym}[[:space:]]*$" --include='Kconfig*' . || true)

            if [ -n "$KCONF_HITS" ]; then
              FIRST_LOC=$(printf '%s\n' "$KCONF_HITS" | head -n1 | cut -d: -f1,2 | sed 's|^\./||')
              KCONF_CELL="✅ \`${FIRST_LOC}\`"

              # Simpan blok dependensi Kconfig ke log detail
              {
                echo "=== CONFIG_${sym} (${FIRST_LOC}) ==="
                KFILE=$(printf '%s\n' "$KCONF_HITS" | head -n1 | cut -d: -f1)
                KLINE=$(printf '%s\n' "$KCONF_HITS" | head -n1 | cut -d: -f2)
                awk -v start="$KLINE" '
                  NR == start { print; next }
                  NR > start {
                    if ($0 ~ /^[[:space:]]*(menuconfig|config|menu|endmenu|choice|endchoice|comment|if|endif|source)[[:space:]]/ || $0 ~ /^[[:space:]]*help[[:space:]]*$/) exit
                    print
                  }
                ' "$KFILE"
                echo ""
              } >> "$DETAILS_LOG"
            else
              KCONF_CELL="❌ *Tidak ada di tree*"
              echo "=== CONFIG_${sym}: TIDAK DITEMUKAN DI KCONFIG TREE ===" >> "$DETAILS_LOG"
              echo "" >> "$DETAILS_LOG"
            fi

            DEF_STAT=$(get_status "$DEFCONFIG_FILE" "$sym")
            OUT_STAT=$(get_status "$OUT_CONFIG" "$sym")

            echo "| \`CONFIG_${sym}\` | ${KCONF_CELL} | ${DEF_STAT} | ${OUT_STAT} |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo ""
            echo "<details><summary>📄 Detail Blok Kconfig & Dependensi (<code>depends on</code> / <code>select</code>)</summary>"
            echo ""
            echo '```kconfig'
            cat "$DETAILS_LOG"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "📤 Upload resolved .config"
        uses: actions/upload-artifact@v7
        with:
          name: resolved-config-${{ matrix.base }}
          path: kernel_src/out/.config
          retention-days: 3
