          |  * YOUR AUTHORITY (ROOT & SECURITY) ~~~~~~~~~~~~~~~ |
          |   • Vanilla & BakaSU (Multi Manager Support)        |
          |   • Integrated with SUSFS (GKI A13-5.15)            |
          |   • Metamodule Nomount built-in Support             |
          |   • Baseband-guard v1 Support                       |
          |                                                     |
          |  * SNOWBOUND EXTRAS ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ |
          |   • Droidspaces Support with the note activated     |
          |   • Kprofiles Support                               |
          |                                                     |
          +--------------------- * - + - * ---------------------+
          |                                                     |
          |  Before you defy fate, how good you are  :          |
