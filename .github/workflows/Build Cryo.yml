name: "Build Cryo Kernel (using dynamic injection setup)"  
  # Dynamic Kernel Build System setup If you find an issue,
  # immediately fix it yourself because the dynamic setup in my branch will be fixed if it is truly successful and running optimally. 

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  actions: read

on:
  schedule:
    - cron: "0 19 * * 5"
  workflow_dispatch:
     inputs:
      ksu_manager:
        description: "Root manager untuk varian KSU"
        type: choice
        options:
          - BakaSU          
          - SukiSU-Ultra+KPM
          - SukiSU-Ultra-susfs
          - KernelSU-Next-pershoot 
          - KernelSU-Official
          - BakaSU-susfs
          - KernelSU-Next-pershoot_selinux-hide
        default: "BakaSU"
      ksu_ref:
        description: "Opsional: branch/tag manager (kosong = bawaan tiap manager)"
        required: false
        default:  ""
      toolchain_type:
        description: "Pilih jenis Toolchain"
        type: choice
        options:
          - android-tools
          - custom-tools
        default: android-tools       
      customClangRepo:
        description: "Repo clang (HANYA DIPAKAI JIKA memilih 'custom-tools' di atas)"
        type: choice
        options:
          - greenforce-project/greenforce_clang
          - Neutron-Toolchains/antman
          - ZyCromerZ/Clang
          - XSans0/WeebX-Clang
        default: greenforce-project/greenforce_clang
      customClangTag:
        description: "Tag release (opsional; kosong = latest. ZyCromerZ kosong = 14.0.6-20261022-release. Diabaikan untuk antman & WeebX)"
        type: string
        required: false
        default: ""
      droidspaces_support: 
       description: "Add droidspaces proper support?"
       required: true
       type: boolean
       default: false   
      susfsSupport:
        description: "Add SUSFS Implementation?"
        required: true
        type: boolean
        default: true
      susfs_commit:
        description: "Commit hash SUSFS4KSU (kosongkan untuk mengambil versi terbaru)"
        required: false
        type: string
        default: ""         
                                  
jobs:
  build-kernels:
    name: "❄️ Build Cryo ${{ matrix.kernel.name }} kernel"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI"
            dir: "common_gki"
            repo_name: "common"
            repo_url: "https://github.com/Codename-riho/Kernel_builder.git"
            branch: "google"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image.gki.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/Codename-riho/Kernel_builder/refs/heads/Builders/.github/Patches/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO"
            dir: "common_clo"
            repo_name: "clo"
            repo_url: "https://github.com/Codename-riho/Kernel_builder.git"
            branch: "codelinaro"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image.clo.ksu"
            enable_ksu: true
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/Codename-riho/Kernel_builder/refs/heads/Builders/.github/Patches/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "GKI-NoKSU"
            dir: "common_gki_noksu"
            repo_name: "common"
            repo_url: "https://github.com/Codename-riho/Kernel_builder.git"
            branch: "google"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-GKI"
            output_name: "Image.gki.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/Codename-riho/Kernel_builder/refs/heads/Builders/.github/Patches/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
          - name: "CLO-NoKSU"
            dir: "common_clo_noksu"
            repo_name: "clo"
            repo_url: "https://github.com/Codename-riho/Kernel_builder.git"
            branch: "codelinaro"
            defconfig: "gki_defconfig"
            local_version: "-Cryo-CLO"
            output_name: "Image.clo.noksu"
            enable_ksu: false
            extra_patches:
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-gki-fixup.patch"
              - "https://raw.githubusercontent.com/Codename-riho/Kernel_builder/refs/heads/Builders/.github/Patches/0001-scripts-sign-builds.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-Don-t-append-and-dirty-to-localversion.patch"
              - "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/0001-scripts-do-not-ship-full-auto_localversion.patch"
    env:
      KERNEL_LOC_DIR: ${{ matrix.kernel.dir }}
      KERNEL_NAME: ${{ matrix.kernel.repo_name }}
      KERNEL_REPO: ${{ matrix.kernel.repo_url }}
      KERNEL_BRANCH: ${{ matrix.kernel.branch }}
      DEFCONFIG_NAME: ${{ matrix.kernel.defconfig }}
      LOCAL_VERSION: ${{ matrix.kernel.local_version }}
      OUTPUT_NAME: ${{ matrix.kernel.output_name }}
      WORK_DIR: ${{ github.workspace }}
      
      # default aman untuk schedule + manual run
      TOOLCHAIN_TYPE: "${{ inputs.toolchain_type || 'android-tools' }}"
      DROIDSPACES_SUPPORT: "${{ inputs.droidspaces_support && 'true' || 'false' }}"   # bawaan: mati
      SUSFS_SUPPORT: "${{ format('{0}', inputs.susfsSupport) == 'false' && 'false' || 'true' }}"   # bawaan: aktif
      KSU_MANAGER: "${{ inputs.ksu_manager || 'BakaSU' }}"
      KSU_REF: "${{ inputs.ksu_ref || '' }}"
      SUSFS_COMMIT: "${{ inputs.susfs_commit || '' }}"

    steps:        
      - name: "✨ Setup workspace (cleanup + dependensi)"
        run: |
          set -euo pipefail

          avail()  { df -B1 --output=avail / | tail -n 1 | tr -d ' '; }
          human()  { numfmt --to=iec-i --suffix=B --format='%.1f' "$1"; }
          echo "💾 Disk sebelum cleanup: $(df -h / | awk 'NR==2{print $4" bebas dari "$2" ("$5" terpakai)"}')"

          # ── 1) Cleanup tool bawaan runner (senyap) ──
          A0=$(avail)
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/share/boost \
                      "${AGENT_TOOLSDIRECTORY:-/nonexistent}"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo docker builder prune -a -f       >/dev/null 2>&1 || true
          A1=$(avail)
          FREED=$(( A1 - A0 )); [ "$FREED" -gt 0 ] || FREED=0

          echo "✅ Pembersihan selesai"
          echo "💾 Total penyimpanan yang direbut kembali: $(human "$FREED")"

          # ── 2) Workspace ──
          mkdir -p "${{ env.KERNEL_LOC_DIR }}"
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "✅ Workspace siap"

          # ── 3) Dependensi build (log disimpan, hanya ditampilkan jika gagal) ──
          APT_LOG=$(mktemp)
          PKG0=$(dpkg-query -f '.\n' -W | wc -l)
          if ! {
            sudo apt-get update -qq &&
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Use-Pty=0 \
              repo rsync aria2 bc bison libxml2-16 libxml2-dev libxml2-utils \
              build-essential ca-certificates clang cpio curl dwarves flex gcc-aarch64-linux-gnu git \
              libdw-dev libelf-dev libssl-dev lld llvm llvm-dev pkg-config python3 unzip xz-utils zip
          } >"$APT_LOG" 2>&1; then
            echo "❌ Instalasi dependensi gagal. Log lengkap:"
            cat "$APT_LOG"
            exit 1
          fi
          PKG1=$(dpkg-query -f '.\n' -W | wc -l)
          A2=$(avail)
          USED=$(( A1 - A2 )); [ "$USED" -gt 0 ] || USED=0

          echo "✅ Dependensi terpasang"
          echo "📦 Paket baru: $(( PKG1 - PKG0 )) | penyimpanan terpakai: $(human "$USED")"
          echo "💾 Disk sesudah setup: $(df -h / | awk 'NR==2{print $4" bebas dari "$2" ("$5" terpakai)"}')"
          
      - name: 🚧 Setup SWAP 24GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 24

      - name: 🔥 Tune Swap
        run: |
            echo "vm.swappiness=90" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p
            
      - name: "🎭 Clone kernel source"
        working-directory: ./${{ env.KERNEL_LOC_DIR }}
        run: |
          # Atur buffer git untuk mencegah early EOF
          git config --global http.postBuffer 524288000

           # Retry loop untuk clone (mencegah error putus koneksi sesaat)
          for i in {1..3}; do
            git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
              ${{ env.KERNEL_REPO }} ${{ env.KERNEL_NAME }} --depth=1 && break || {
              echo "⚠️ Clone gagal, mencoba ulang ($i/3)..."
              sleep 5
            }
          done
          
      - name: "🧰 Setup toolchain"
        working-directory: ${{ env.WORK_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG_REPO: ${{ github.event.inputs.customClangRepo }}
          CLANG_TAG: ${{ github.event.inputs.customClangTag }}
        run: |
          set -euo pipefail

          # Semua output disimpan ke log; hanya ditampilkan jika gagal
          LOG=$(mktemp)
          exec 3>&1 4>&2 >"$LOG" 2>&1
          
          finish() {
            rc=$?
            exec 1>&3 2>&4
            [ -z "${DL_DIR:-}" ] || rm -rf "$DL_DIR"
            if [ "$rc" -eq 0 ]; then
              echo "✅ Setup Toolchain Berhasil"
              if [ "$TOOLCHAIN_TYPE" = "android-tools" ]; then
                echo "📦 Memakai toolchain type : android-tools (clang-r614150)"
              else
                echo "📦 Memakai toolchain type : custom-tools (${CLANG_REPO}${CLANG_TAG:+@$CLANG_TAG})"
              fi
            else
              echo "❌ Setup toolchain gagal (exit $rc). Log lengkap:"
              cat "$LOG"
            fi
            rm -f "$LOG"
          }
          trap finish EXIT

          if [ "$TOOLCHAIN_TYPE" = "android-tools" ]; then
            echo "📥 Mode android-tools: AOSP repo + Clang r614150"

            # Konfigurasi global git untuk transfer file besar
            git config --global http.postBuffer 524288000
            git config --global http.lowSpeedLimit 1000
            git config --global http.lowSpeedTime 600
            
            # Clean up existing repo and common directories
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git config --global color.ui false

            rm -rf .repo common
            repo init -u https://android.googlesource.com/kernel/manifest \
              -b common-android13-5.15 --depth=1 --no-clone-bundle --no-repo-verify
            repo sync -c --no-tags --no-clone-bundle -j"$(nproc --all)" --force-sync

            # kernel milik sendiri ada di ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
            rm -rf common
            
            # Download updated Clang r614150 dari repositori Android Git
            CLANG_DIR="prebuilts/clang/host/linux-x86"
            CLANG_TAR="${CLANG_DIR}/clang-r614150.tar.gz"
            CLANG_OUT="${CLANG_DIR}/clang-r614150"

            echo "📦 Mengunduh Clang r614150..."
            aria2c -x 16 -s 16 -o "$CLANG_TAR" "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"

            mkdir -p "$CLANG_OUT"
            tar -xzf "$CLANG_TAR" -C "$CLANG_OUT"
            rm -f "$CLANG_TAR"

            # Hapus versi Clang lain yang tidak digunakan
            echo "🧹 Membuang versi Clang yang tidak terpakai..."
            rm -rf \
              "${CLANG_DIR}/clang-3289846" \
              "${CLANG_DIR}/clang-r547379" \
              "${CLANG_DIR}/clang-r584948" \
              "${CLANG_DIR}/clang-r596125" \
              "${CLANG_DIR}/clang-stable"

            # Patch Konfigurasi Build
            KERNEL_PATH="${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}"

            # Perbarui build.config.constants
            sed -i \
              -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
              -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r614150/' \
              "${KERNEL_PATH}/build.config.constants"

            # Perbarui build.config.gki
            sed -i \
              -e '/^DEFCONFIG=gki_defconfig/d' \
              -e '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' \
              -e '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
              "${KERNEL_PATH}/build.config.gki"

            # Perbarui build.config.gki.aarch64 (KMI Enforcement & Modules)
            sed -i \
              -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
              -e '/^TRIM_NONLISTED_KMI=/d' \
              -e '/^KMI_ENFORCED=/d' \
              -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
              -e '$a\TRIM_NONLISTED_KMI=0' \
              -e '$a\KMI_ENFORCED=0' \
              -e '/^MODULES_ORDER=/d' \
              -e '/^MODULES_LIST=/d' \
              "${KERNEL_PATH}/build.config.gki.aarch64"

          else
            echo "💫 Mode custom-tools: $CLANG_REPO"

            # ── Konfigurasi ────────────────────────────────────────────────────────
            ZYC_DEFAULT_TAG="14.0.6-20261022-release"   # dipakai jika customClangTag kosong
            WEEBX_LINK_URL="https://raw.githubusercontent.com/XSans0/WeebX-Clang/main/main/link.txt"
            ASSET_RE='\.(tar\.(gz|xz|bz2|zst)|tgz|zip)$'
            ASSET_SKIP_RE='(sha|md5|sig|asc|src|source)'

            DL_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/clang-dl.XXXXXX")"

            log()  { echo "$*"; }
            fail() { echo "::error::$*"; exit 1; }

            # ── Validasi input (sebelum dipakai di URL / path) ────────────────────
            case "$CLANG_REPO" in
              greenforce-project/greenforce_clang|Neutron-Toolchains/antman|ZyCromerZ/Clang|XSans0/WeebX-Clang) ;;
              *) fail "Repo clang tidak dikenal: $CLANG_REPO" ;;
            esac
            
            if [ -n "$CLANG_TAG" ] && ! [[ "$CLANG_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              fail "Format customClangTag tidak valid: $CLANG_TAG"
            fi

            # ── Helper ─────────────────────────────────────────────────────────────
            # Ambil URL asset arsip dari GitHub Release (tag kosong = latest)
            release_asset_url() {
              local repo="$1" tag="$2" api json
              
              if [ -n "$tag" ]; then 
                api="https://api.github.com/repos/$repo/releases/tags/$tag"
              else                   
                api="https://api.github.com/repos/$repo/releases/latest"
              fi
              
              json=$(curl -fsSL --retry 3 --retry-delay 3 \
                       -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" "$api") \
                || fail "Gagal mengakses release $repo ${tag:+(tag $tag)}"
                
              jq -r --arg re "$ASSET_RE" --arg skip "$ASSET_SKIP_RE" '
                  [ .assets[]?
                    | select(.name | test($re; "i"))
                    | select(.name | test($skip; "i") | not) ]
                  | .[0].browser_download_url // empty' <<<"$json"
            }

            # Unduh arsip lalu ekstrak ke clang_toolchain
            fetch_and_extract() {
              local url="$1" name archive
              [[ "$url" =~ ^https:// ]] || fail "URL bukan HTTPS: $url"
              name="$(basename "${url%%\?*}")"
              archive="$DL_DIR/$name"
              
              log "✅ URL: $url"
              curl -fL --retry 3 --retry-delay 5 --progress-bar -o "$archive" "$url" \
                || fail "Gagal mengunduh $url"
                
              log "🔐 SHA256: $(sha256sum "$archive" | cut -d' ' -f1)"
              log "📦 Ekstraksi $name..."
              
              case "$name" in
                *.zip) unzip -q "$archive" -d clang_toolchain ;;
                *)     tar -xf "$archive" -C clang_toolchain ;;
              esac
            }

            # ── Ambil toolchain sesuai sumber ──────────────────────────────────────
            rm -rf clang_toolchain
            mkdir -p clang_toolchain

            case "$CLANG_REPO" in
              Neutron-Toolchains/antman)
                log "🫳 Mengambil Neutron Clang via antman..."
                (
                  cd clang_toolchain
                  curl -fsSL --retry 3 -o antman "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
                  chmod +x antman
                  ./antman -S
                )
                ;;

              ZyCromerZ/Clang)
                TAG="${CLANG_TAG:-$ZYC_DEFAULT_TAG}"
                log "📦 ZyCromerZ Clang (tag: $TAG)..."
                url=$(release_asset_url "$CLANG_REPO" "$TAG")
                [ -n "$url" ] || fail "Asset arsip tidak ditemukan di $CLANG_REPO@$TAG"
                fetch_and_extract "$url"
                ;;

              *)  # greenforce-project/greenforce_clang (juga WeebX & repo lain berbasis Releases)
                log "📦 Mengunduh custom toolchain dari $CLANG_REPO${CLANG_TAG:+ (tag $CLANG_TAG)}..."
                url=$(release_asset_url "$CLANG_REPO" "$CLANG_TAG")
                
                if [ -z "$url" ] && [ "$CLANG_REPO" = "XSans0/WeebX-Clang" ] && [ -z "$CLANG_TAG" ]; then
                  # Cadangan: WeebX menyimpan URL arsip terbaru di main/link.txt
                  log "ℹ️ Release latest tidak punya asset, mencoba link.txt..."
                  url=$(curl -fsSL --retry 3 --retry-delay 3 "$WEEBX_LINK_URL" | tr -d '\r' | sed -n '1p' | xargs) || url=""
                fi
                
                [ -n "$url" ] || fail "Asset arsip (tar/zip) tidak ditemukan di $CLANG_REPO${CLANG_TAG:+@$CLANG_TAG}"
                fetch_and_extract "$url"
                ;;
            esac

            # ── Cari biner clang (file biasa DAN symlink) ──────────────────────────
            CLANG_EXEC=$(find clang_toolchain \( -type f -o -type l \) -name clang -path '*/bin/clang' | head -n1)
            [ -n "$CLANG_EXEC" ] || CLANG_EXEC=$(find clang_toolchain \( -type f -o -type l \) -name clang | head -n1)

            if [ -z "$CLANG_EXEC" ]; then
              echo "::error::Biner clang tidak ditemukan! Isi folder ekstraksi:"
              ls -la clang_toolchain
              exit 1
            fi

            CLANG_PATH="$(readlink -f "$(dirname "$CLANG_EXEC")")"
            echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"
            echo "$CLANG_PATH" >> "$GITHUB_PATH"

            log "✅ Biner Clang ditemukan di: $CLANG_PATH"
            "$CLANG_PATH/clang" --version | head -n1

            # Pastikan biner toolchain bisa dijalankan (pustaka dinamis lengkap)
            for b in clang ld.lld; do
              [ -e "$CLANG_PATH/$b" ] || continue
              missing=$(ldd "$CLANG_PATH/$b" 2>/dev/null | grep "not found" || true)
              [ -z "$missing" ] || { echo "::error::Dependensi $b hilang: $missing"; exit 1; }
            done
          fi

      - name: "😎 Set args for GKI kernels"
        if: ${{ env.TOOLCHAIN_TYPE == 'custom-tools' }}
        id: generate-args
        working-directory: ./${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
            args="-j$(nproc --all)"
            if [ -n "${{ env.OUT_DIR }}" ]; then
              mkdir -p $(pwd)/${{ env.OUT_DIR }}
              args="$args O=$(pwd)/${{ env.OUT_DIR }}"
            fi
            args="$args ARCH=arm64 LLVM=1 LTO=full"
            args="$args CROSS_COMPILE=aarch64-linux-gnu-"
            args="$args CLANG_TRIPLE=aarch64-linux-gnu-"
            args="$args AR=llvm-ar"
            args="$args CC=clang"
            echo "args=$args" >> $GITHUB_OUTPUT
            
      - name: "🧩 Configure kernel & patches"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Fix localversion
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/g' "$CONFIG_FILE" || true
          echo "CONFIG_LOCALVERSION=\"${{ env.LOCAL_VERSION }}\"" >> "$CONFIG_FILE"
          
          apply_patch() {
            local url="$1" name file
            name=$(basename "$url"); file="/tmp/$name"
            curl -fsSL --retry 3 -o "$file" "$url" || { echo "::error::Gagal unduh $name"; exit 1; }

            if patch -p1 -R --dry-run -s -f < "$file" >/dev/null 2>&1; then
              echo "✅ Sudah terpasang, dilewati: $name"
            elif patch -p1 --dry-run -s -f < "$file" >/dev/null 2>&1; then
              patch -p1 -s --batch --no-backup-if-mismatch < "$file"
              echo "✅ Berhasil dipasang: $name"
            else
              echo "::error::Patch tidak cocok: $name"
              patch -p1 --dry-run --batch < "$file" || true
              exit 1
            fi
            rm -f "$file"
          }

          while read -r p; do
            [ -n "$p" ] || continue
            apply_patch "$p"
          done < <(echo '${{ toJSON(matrix.kernel.extra_patches) }}' | jq -r '.[]')
          
          # Use scripts/config for safe config manipulation
          scripts/config --file "$CONFIG_FILE" \
            -e CONFIG_KALLSYMS \
            -e CONFIG_KALLSYMS_ALL \
            -e CONFIG_TCP_CONG_ADVANCED \
            -d CONFIG_QCOM_DLOAD_MODE \
            -d CONFIG_TCP_CONG_BIC \
            -d CONFIG_TCP_CONG_HTCP \
            -e CONFIG_TCP_CONG_WESTWOOD \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_TCP_CONG_BBR3 \
            -d CONFIG_DEFAULT_BBR \
            -e CONFIG_DEFAULT_BBR3 \
            --set-str CONFIG_DEFAULT_TCP_CONG "bbr3" \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_WQ_POWER_EFFICIENT_DEFAULT \
            -e CONFIG_BOEFFLA_WL_BLOCKER \
            -e CONFIG_PM_WAKELOCKS \
            --set-val CONFIG_PM_WAKELOCKS_LIMIT 100 \
            -e CONFIG_PM_WAKELOCKS_GC \
            -e CONFIG_SUSPEND \
            -e CONFIG_SUSPEND_FREEZER \
            -e CONFIG_LRU_GEN \
            -e CONFIG_LRU_GEN_ENABLED \
            -e CONFIG_CRYPTO_LZ4 \
            -e CONFIG_ZRAM_DEF_COMP_LZ4 \
            -e CONFIG_CRYPTO_LZO \
            -d CONFIG_ZRAM_DEF_COMP_LZORLE \
            -d CONFIG_ZRAM_DEF_COMP_LZO \
            -d CONFIG_ZRAM_DEF_COMP_ZSTD \
            -d CONFIG_ZRAM_DEF_COMP_LZ4HC \
            -d CONFIG_ZRAM_DEF_COMP_842 \
            -d CONFIG_KERNEL_BZIP2 \
            -d CONFIG_KERNEL_UNCOMPRESSED \
            -e CONFIG_NO_HZ_IDLE \
            -e CONFIG_HZ_250 \
            -e CONFIG_KPROFILES 
          
          # Remove duplicate lines safely
          sed -i '/ZRAM_DEF_COMP_LZO/d' "$CONFIG_FILE" || true

          #Petakan konfigurasi otomatis untuk shuedule
            echo "📦 TOOLCHAIN_TYPE=${TOOLCHAIN_TYPE}"
            echo "🏜️📦 DROIDSPACES_SUPPORT=${DROIDSPACES_SUPPORT}"
            echo "ඞ SUSFS_SUPPORT=${SUSFS_SUPPORT}"
            echo "⚔️ KSU_MANAGER=${KSU_MANAGER}"

      - name: "🚄 Porting BBRv3 + PLB (cherry-pick)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          BBR3_SHA: 7bc9793d909f52f4a6cd45dd1381b2f200c18a7c
          BBR3_REPO: https://github.com/topnotchfreaks/kernel_msm-5.15.git
        run: |
          set -euo pipefail
          DEFCFG=arch/arm64/configs/unified_defconfig

          echo "🔄 Menyiapkan Git untuk Porting"
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git config advice.mergeConflict false
          git config advice.detachedHead false

          # Simpan perubahan step sebelumnya sebagai commit sementara.
          # Saat keluar (sukses/gagal) HEAD dikembalikan ke semula, perubahan tetap ada di working tree.
          BASE=$(git rev-parse HEAD)
          trap 'git reset -q --mixed "$BASE" || true' EXIT
          git add -A
          git commit -q --allow-empty --no-verify -m "wip: snapshot sebelum porting BBRv3"

          echo "📥 Mengambil BBRv3 dari repositori pihak ketiga"
          git fetch -q --no-tags --depth=2 "$BBR3_REPO" "$BBR3_SHA"

          echo "⚙️ Melakukan Cherry-Pick BBRv3"
          # -n: tanpa commit. Konflik defconfig di GKI diharapkan (file itu tidak ada di sana).
          git cherry-pick -n "$BBR3_SHA" >/tmp/bbr3-pick.log 2>&1 || true
          grep -E 'CONFLICT|Auto-merging' /tmp/bbr3-pick.log | sed 's/^/  /' || true

          # defconfig tidak dipakai (config diatur lewat scripts/config): kembalikan ke keadaan HEAD
          if git cat-file -e "HEAD:$DEFCFG" 2>/dev/null; then
            git checkout -q HEAD -- "$DEFCFG"
          else
            git rm -f -q --ignore-unmatch -- "$DEFCFG"
          fi

          # Konflik yang tersisa = konflik sungguhan: batalkan porting, tampilkan daftar file
          UNMERGED=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$UNMERGED" ]; then
            echo "::error::Porting BBRv3 gagal, konflik pada file berikut:"
            echo "$UNMERGED" | sed 's/^/  - /'
            git reset -q --hard HEAD     # kembali ke snapshot (perubahan step sebelumnya tetap aman)
            exit 1
          fi

          for f in net/ipv4/tcp_bbr3.c net/ipv4/tcp_plb.c; do
            [ -f "$f" ] || { echo "::error::$f tidak terbentuk setelah cherry-pick"; exit 1; }
          done
          if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- net include >/dev/null 2>&1; then
            echo "::error::masih ada penanda konflik di net/ atau include/"; exit 1
          fi
          echo "✅ BBRv3 + PLB terpasang"
                        
      - name: "🏜️📦 Add Droidspaces Support (kABI patch + GKI defconfig)"
        if: ${{ env.DROIDSPACES_SUPPORT == 'true' }}
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          NO_IP6_NAT: "1"
          DS_REF: main                  # branch/tag/commit Droidspaces-OSS
          DS_OPTIONAL_FEATURES: "true"  # IPv6 NAT, macvlan, UFW, Fail2ban, tmpfs xattr/ACL
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          DS_RAW="${DS_RAW:-https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/${DS_REF}/Documentation/resources/kernel-patches/GKI}"

          # --- 1. Pilih patch kABI sesuai versi kernel ---------------------------
          KVER=$(sed -n 's/^VERSION = //p' Makefile | head -n 1)
          KPL=$(sed -n 's/^PATCHLEVEL = //p' Makefile | head -n 1)
          [ -n "$KVER" ] && [ -n "$KPL" ] || die "Gagal membaca versi kernel dari Makefile"
          KNUM=$((KVER * 100 + KPL))
          echo "Kernel $KVER.$KPL"

          [ "$KNUM" -ge 504 ] || die "Droidspaces GKI membutuhkan kernel 5.4+ (terdeteksi $KVER.$KPL)"
          [ "$KNUM" -lt 612 ] || die "Kernel $KVER.$KPL memakai patch folder kernel-6.12 (belum didukung step ini)"

          PATCHES="below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch"
          if [ "$KNUM" -le 510 ]; then
            # 5.10 ke bawah: POSIX mqueue juga perlu padding ABI Android
            PATCHES="$PATCHES below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
          fi

          for p in $PATCHES; do
            f="/tmp/ds_$(basename "$p")"
            echo "📥 Mengunduh $p"
            curl -fsSL --retry 3 --retry-delay 5 -o "$f" "$DS_RAW/$p" \
              || die "Gagal mengunduh patch Droidspaces: $p"

            if git apply --check -R --ignore-whitespace "$f" >/dev/null 2>&1; then
              echo "✅ Sudah terpasang, dilewati: $p"
            else
              git apply -v --ignore-whitespace "$f" \
                || die "Droidspaces patch gagal diterapkan: $p"
              echo "✅ Berhasil dipasang: $p"
            fi
            rm -f "$f"
          done

          # --- 2. Edit gki_defconfig langsung (bukan fragment) -------------------
          CFG="arch/arm64/configs/${DEFCONFIG_NAME}"
          [ -f "$CFG" ] || die "Defconfig tidak ditemukan: $CFG"

          # Wajib: IPC, namespace, devtmpfs, NAT
          REQUIRED="SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS NETFILTER_XT_MATCH_ADDRTYPE"
          # Opsional tapi disarankan (aman untuk kABI bersama patch di atas)
          OPTIONAL="USER_NS IP6_NF_NAT IP6_NF_TARGET_MASQUERADE MACVLAN
                    NETFILTER_XT_TARGET_REJECT NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_RECENT
                    IP_SET IP_SET_HASH_IP IP_SET_HASH_NET NETFILTER_XT_SET
                    TMPFS_POSIX_ACL TMPFS_XATTR"
          [ "${DS_OPTIONAL_FEATURES:-true}" = "true" ] || OPTIONAL=""
          # GKI|CLO normal: jangan aktifkan lagi IPv6 NAT (dilarang VINTF)
          if [ "${NO_IP6_NAT:-0}" = 1 ]; then
            OPTIONAL="${OPTIONAL//IP6_NF_NAT/}"
            OPTIONAL="${OPTIONAL//IP6_NF_TARGET_MASQUERADE/}"
          fi

          for o in $REQUIRED $OPTIONAL; do
            scripts/config --file "$CFG" -e "CONFIG_$o"
          done

          # --- 3. Verifikasi hasil ----------------------------------------------
          for o in $REQUIRED; do
            grep -q "^CONFIG_${o}=y" "$CFG" || die "CONFIG_${o} gagal diaktifkan di $CFG"
          done
          for o in $OPTIONAL; do
            grep -q "^CONFIG_${o}=y" "$CFG" || echo "::warning::CONFIG_${o} tidak aktif di $CFG"
          done

          # --- 4. Pengaman kABI: dua opsi ini JANGAN aktif di GKI ----------------
          # CFS_BANDWIDTH (--cpus) & CGROUP_PIDS (--pids-limit) mengubah CRC ribuan
          # simbol ekspor -> modul vendor ditolak -> bootloop. Tidak disentuh di sini.
          for o in CFS_BANDWIDTH CGROUP_PIDS; do
            if grep -q "^CONFIG_${o}=y" "$CFG"; then
              echo "::warning::CONFIG_${o}=y terdeteksi di $CFG - berisiko merusak kABI (bootloop)"
            fi
          done

          echo "✅ Droidspaces: patch kABI + defconfig siap (kernel $KVER.$KPL)"
          
      - name: "😋 Add BBG & NoMount"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          scripts/config --file arch/arm64/configs/${{ env.DEFCONFIG_NAME }} -e CONFIG_BBG
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig
          curl -LSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -
      
      - name: "⚔️ Setup Ksu Variant (${{ inputs.ksu_manager || 'BakaSU' }})"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ env.KSU_MANAGER }}
          KSU_REF: ${{ env.KSU_REF }}
          ENABLE_SUSFS: ${{ env.SUSFS_SUPPORT }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          MULTI_MANAGER_PATCH="https://raw.githubusercontent.com/RapliVx/kernel_builder/refs/heads/main/patch/ksun-add-more-managers-support.patch"
          EXTRA_PATCH_URL=""

          # Konfigurasi per manager
          case "$KSU_MANAGER" in
            BakaSU)
              REPO="Baka-SU/BakaSU"
              SETUP_BRANCH=main
              DEFAULT_REF=main
              NEED_SUSFS_PATCH=0
              ;;
            BakaSU-susfs)
              REPO="Baka-SU/BakaSU"
              SETUP_BRANCH=sync-up
              DEFAULT_REF=sync-up
              NEED_SUSFS_PATCH=0
              ;;
            SukiSU-Ultra+KPM)
              REPO="SukiSU-Ultra/SukiSU-Ultra"
              SETUP_BRANCH=main
              DEFAULT_REF=builtin
              NEED_SUSFS_PATCH=0
              ;;
            SukiSU-Ultra-susfs)
              REPO="SukiSU-Ultra/SukiSU-Ultra"
              SETUP_BRANCH=main
              DEFAULT_REF=susfs_new
              NEED_SUSFS_PATCH=0
              ;;
            KernelSU-Next-pershoot)
              REPO="pershoot/KernelSU-Next"
              SETUP_BRANCH=dev-susfs
              DEFAULT_REF=dev-susfs
              NEED_SUSFS_PATCH=0
              EXTRA_PATCH_URL="$MULTI_MANAGER_PATCH"
              ;;
            KernelSU-Next-pershoot_selinux-hide)
              REPO="pershoot/KernelSU-Next"
              SETUP_BRANCH=dev-susfs-selinux_hide
              DEFAULT_REF=dev-susfs-selinux_hide
              NEED_SUSFS_PATCH=0
              EXTRA_PATCH_URL="$MULTI_MANAGER_PATCH"
              ;;
            KernelSU-Official)
              REPO="tiann/KernelSU"
              SETUP_BRANCH=main
              DEFAULT_REF=main
              NEED_SUSFS_PATCH=1
              EXTRA_PATCH_URL="$MULTI_MANAGER_PATCH"
              ;;
            *)
              die "Fatal Error: Varian manager tidak dikenal: $KSU_MANAGER"
              ;;
          esac

          NEED_SUSFS_ORIG=$NEED_SUSFS_PATCH   # kebutuhan asli manager, sebelum input SUSFS menimpanya

          # Logika untuk menonaktifkan SUSFS jika diminta pengguna
            if [ "$ENABLE_SUSFS" = "false" ]; then
               echo "ℹ️ Opsi SUSFS dinonaktifkan dari input. Mengabaikan kebutuhan patch SUSFS."
               NEED_SUSFS_PATCH=0
            fi

          REPO_URL="https://github.com/${REPO}.git"

          # Branch tempat setup.sh berada harus ada; jika tidak, pakai branch default repo
          if ! git ls-remote --exit-code --heads "$REPO_URL" "$SETUP_BRANCH" >/dev/null 2>&1; then
            DEF_BR=$(git ls-remote --symref "$REPO_URL" HEAD 2>/dev/null | awk '/^ref:/{sub("refs/heads/","",$2); print $2; exit}')
            [ -n "$DEF_BR" ] || die "Fatal Error: repo $REPO tidak bisa diakses"
            echo "::warning::Branch setup '$SETUP_BRANCH' tidak ada di $REPO, memakai '$DEF_BR'"
            SETUP_BRANCH="$DEF_BR"
          fi

          REF="${KSU_REF:-$DEFAULT_REF}"

          # setup.sh memakai `git checkout "$1" || echo default`: ref yang salah TIDAK error,
          # hanya diam-diam memakai branch default. Cek dulu supaya tidak salah build.
          if [ -n "$REF" ] && ! git ls-remote --exit-code "$REPO_URL" "refs/heads/$REF" "refs/tags/$REF" >/dev/null 2>&1; then
            if [ -n "${KSU_REF:-}" ] || { [ "$NEED_SUSFS_ORIG" != 1 ] && [ "$ENABLE_SUSFS" != "false" ]; }; then
              echo "Branch yang tersedia di $REPO:"
              git ls-remote --heads "$REPO_URL" | sed 's#.*refs/heads/#  - #' | head -20
              die "Fatal Error: ref '$REF' tidak ada di $REPO"
            fi
            echo "::warning::Ref bawaan '$REF' tidak ada di $REPO, memakai branch default repo"
            REF=""
          fi

          SETUP_URL="https://raw.githubusercontent.com/${REPO}/${SETUP_BRANCH}/kernel/setup.sh"
          echo "Manager: $KSU_MANAGER | ref: ${REF:-latest release tag}"
          echo "Setup script: $SETUP_URL"

          # Hapus instalasi sebelumnya jika ada, lalu jalankan skrip setup
          rm -rf ./KernelSU ./KernelSU-Next ./drivers/kernelsu
          curl -fsSL -o /tmp/ksu_setup.sh "$SETUP_URL" \
            || die "Fatal Error: Gagal mengunduh skrip setup dari $SETUP_URL"
            
          bash -x /tmp/ksu_setup.sh ${REF:+"$REF"} \
            || die "Fatal Error: Eksekusi setup.sh untuk $KSU_MANAGER gagal (ref: ${REF:-latest tag})"

          # Cek ketersediaan symlink drivers/kernelsu
          if [ ! -e drivers/kernelsu ]; then
            die "Fatal Error: Symlink drivers/kernelsu tidak ditemukan atau rusak setelah setup."
          fi
          
          # Ambil direktori asli dari root manager
          KSU_DIR=$(readlink -f drivers/kernelsu)
          echo "Install dir: $KSU_DIR"

          # Teruskan hasil ke langkah berikutnya
          {
            echo "KSU_DIR=$KSU_DIR"
            echo "NEED_SUSFS_PATCH=$NEED_SUSFS_PATCH"
            echo "EXTRA_PATCH_URL=$EXTRA_PATCH_URL"
            echo "KSU_REF_USED=${REF:-latest tag}"
          } >> "$GITHUB_ENV"

      - name: "🩹 Patch manager (SUSFS + extra) & enable KSU"
        if: matrix.kernel.enable_ksu == true
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }}
          VARIANT_NAME: ${{ matrix.kernel.name }}
          SUSFS_BRANCH: gki-android13-5.15
          SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          TMPD=$(mktemp -d)
          trap 'rm -rf "$TMPD"' EXIT

          KSU_ROOT=$(git -C "$KSU_DIR" rev-parse --show-toplevel 2>/dev/null || true)
          [ -n "$KSU_ROOT" ] || KSU_ROOT="$(dirname "$KSU_DIR")"

          # ── 1) Patch SUSFS ke manager ──
          if [ "${SUSFS_SUPPORT:-false}" != "true" ]; then
            echo "ℹ️ SUSFS nonaktif, patch SUSFS manager dilewati."
          elif [ "${NEED_SUSFS_PATCH:-0}" != 1 ]; then
            echo "✅ $KSU_MANAGER sudah memakai SUSFS bawaan. Patch manual dilewati."
          else
            echo "📦 Clone SUSFS4KSU ($SUSFS_BRANCH)"
            ok=0
            for i in 1 2 3; do
              if git clone -q --depth=1 -b "$SUSFS_BRANCH" \
                "$SUSFS_REPO" "$TMPD/susfs4ksu"; then
                ok=1
                break
              fi
              echo "⚠️ Clone gagal ($i/3), mencoba lagi..."
              rm -rf "$TMPD/susfs4ksu"
              sleep $((i * 10))
            done
            [ "$ok" = 1 ] || die "Gagal clone susfs4ksu setelah 3 kali percobaan"

            SUSFS_HEAD=$(git -C "$TMPD/susfs4ksu" rev-parse --short HEAD)
            PATCH_FILE="$TMPD/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            [ -f "$PATCH_FILE" ] || die "Patch SUSFS tidak ditemukan: $PATCH_FILE"

            DRY="$TMPD/dry.log"
            can_apply() {
              patch -d "$KSU_ROOT" -p1 --forward --batch --dry-run \
                < "$PATCH_FILE" >"$DRY" 2>&1
            }

            # Jika patch sudah terpasang, lanjutkan step; jangan keluar dari script.
            if patch -d "$KSU_ROOT" -p1 -R --batch --dry-run -s -f \
              < "$PATCH_FILE" >/dev/null 2>&1; then
              echo "✅ Patch SUSFS sudah terpasang di $KSU_MANAGER (susfs4ksu@$SUSFS_HEAD)"
            else
              # Jika ref tidak dipaksa dan patch belum cocok, cari commit main yang cocok.
              if ! can_apply && [ -z "${KSU_REF:-}" ]; then
                [ -d "$KSU_ROOT/.git" ] \
                  || die "$KSU_ROOT bukan checkout git; tidak bisa mencari commit yang cocok"

                echo "⚠️ Patch tidak cocok dengan ${KSU_REF_USED:-latest tag}. Mencari commit main yang cocok (maks. 80 terbaru)..."
                git -C "$KSU_ROOT" fetch -q --depth=80 origin main \
                  || die "Gagal fetch branch main dari origin"

                FOUND=""
                for c in $(git -C "$KSU_ROOT" rev-list -n 80 FETCH_HEAD); do
                  git -C "$KSU_ROOT" checkout -q -f "$c" || continue
                  if can_apply; then
                    FOUND="$c"
                    break
                  fi
                done

                [ -n "$FOUND" ] || {
                  cat "$DRY"
                  die "Tidak ada dari 80 commit main terbaru yang cocok dengan patch SUSFS@$SUSFS_HEAD. Isi ksu_ref dengan commit/tag tertentu."
                }

                echo "✅ Memakai commit main ${FOUND:0:8} yang cocok dengan patch"
                echo "KSU_REF_USED=main@${FOUND:0:8} (otomatis)" >> "$GITHUB_ENV"
              fi

              can_apply || {
                cat "$DRY"
                die "Patch SUSFS tidak cocok dengan $KSU_MANAGER (ref: ${KSU_REF:-${KSU_REF_USED:-?}})"
              }

              patch -d "$KSU_ROOT" -p1 --forward --batch --no-backup-if-mismatch \
                < "$PATCH_FILE" >/dev/null \
                || die "Patch SUSFS gagal saat diterapkan"

              echo "✅ Patch SUSFS berhasil dipasang di $KSU_MANAGER (susfs4ksu@$SUSFS_HEAD)"
              if grep -qi "fuzz" "$DRY"; then
                echo "::warning::Patch SUSFS diterapkan dengan fuzz/offset; periksa hasilnya."
                grep -i "fuzz\|offset" "$DRY" || true
              fi
            fi
          fi

          # ── 2) Ekstra patch manager, jika ada ──
          if [ -n "${EXTRA_PATCH_URL:-}" ]; then
            echo "⚙️ Ekstra patch ditemukan untuk varian $KSU_MANAGER."
            echo "Mengunduh dari: $EXTRA_PATCH_URL"

            EXTRA_PATCH_FILE="$TMPD/extra.patch"
            curl -fsSL --retry 3 -o "$EXTRA_PATCH_FILE" "$EXTRA_PATCH_URL" \
              || die "Gagal mengunduh ekstra patch"
            [ -s "$EXTRA_PATCH_FILE" ] || die "Ekstra patch kosong"

            if patch -d "$KSU_ROOT" -p1 -R --dry-run -s -f \
              < "$EXTRA_PATCH_FILE" >/dev/null 2>&1; then
              echo "✅ Ekstra patch sudah terpasang, dilewati."
            elif patch -d "$KSU_ROOT" -p1 --forward --dry-run \
              < "$EXTRA_PATCH_FILE" >"$TMPD/extra.log" 2>&1; then
              patch -d "$KSU_ROOT" -p1 --forward --batch --no-backup-if-mismatch \
                < "$EXTRA_PATCH_FILE" >/dev/null \
                || die "Ekstra patch gagal diterapkan pada $KSU_MANAGER"
              echo "✅ Ekstra patch berhasil diterapkan."
            else
              cat "$TMPD/extra.log"
              die "Ekstra patch tidak cocok dengan $KSU_MANAGER"
            fi
          else
            echo "✅ Tidak ada ekstra patch untuk $KSU_MANAGER."
          fi

          # ── 3) Aktifkan KernelSU di defconfig ──
          CONFIG_PATH="arch/arm64/configs/$DEFCONFIG_NAME"
          [ -f "$CONFIG_PATH" ] \
            || die "File defconfig tidak ditemukan: $CONFIG_PATH"

          scripts/config --file "$CONFIG_PATH" -e CONFIG_KSU

          KPM_STATE=""
          if [ "$KSU_MANAGER" = "SukiSU-Ultra+KPM" ]; then
            scripts/config --file "$CONFIG_PATH" -e CONFIG_KPM -e CONFIG_KALLSYMS_ALL
            KPM_STATE="aktif"
          else
            echo "ℹ️ KPM dilewati (hanya untuk SukiSU-Ultra+KPM)."
          fi

          VER=$(git -C "$KSU_DIR" describe --tags --always 2>/dev/null || echo Unknown)
          echo "✅ $KSU_MANAGER setup selesai dengan versi: $VER"

          if [ "${SUSFS_SUPPORT:-false}" != "true" ]; then
            SUSFS_TXT="nonaktif"
          elif [ "${NEED_SUSFS_PATCH:-0}" = "1" ]; then
            SUSFS_TXT="patch manual"
          else
            SUSFS_TXT="bawaan"
          fi

          EXTRA_TXT="tidak ada"
          [ -z "${EXTRA_PATCH_URL:-}" ] \
            || EXTRA_TXT="$(basename "${EXTRA_PATCH_URL%%\?*}")"

          echo "${VARIANT_NAME}|${KSU_MANAGER}|${KSU_REF_USED:-?}|${VER}|${KPM_STATE}|${SUSFS_TXT}|${EXTRA_TXT}" \
            > "$WORK_DIR/ksu_info.txt"
            
          # ── 3) Tambahkan edition spesial cryo ──
          # Nama versi KSU: tambahkan "-Cryo-Edition" bila driver mendukungnya
          SUFFIX="Cryo-Edition"
          used_in_c() { grep -rqE --include='*.c' --include='*.h' "\b$1\b" "$KSU_DIR" 2>/dev/null; }

          if grep -q 'KSU_FULL_NAME_FORMAT' "$KSU_DIR/Kconfig" 2>/dev/null; then
            # BakaSU: buang "-dirty", set format lewat config
            sed -i 's/\$(KSU_COMMIT_SHA)-dirty/$(KSU_COMMIT_SHA)/' "$KSU_DIR/Kbuild"
            scripts/config --file "$CONFIG_PATH" \
              --set-str CONFIG_KSU_FULL_NAME_FORMAT "%TAG_NAME%-%COMMIT_SHA%-$SUFFIX"
            echo "✅ Nama versi KSU: <tag>-<sha>-$SUFFIX"
          elif used_in_c KSU_VERSION_FULL; then
            echo "::warning::$KSU_MANAGER memakai KSU_VERSION_FULL tanpa FULL_NAME_FORMAT, perlu tinjau manual"
          elif used_in_c KSU_VERSION_TAG && grep -q 'DKSU_VERSION_TAG=' "$KSU_DIR/Kbuild"; then
            # KernelSU-Next dan sejenisnya: tambahkan suffix pada tag
            sed -i -E 's/(-DKSU_VERSION_TAG=\\"\$\([A-Z_]+\))/\1-'"$SUFFIX"'/' "$KSU_DIR/Kbuild"
            echo "✅ Tag versi KSU diberi suffix -$SUFFIX"
          else
            echo "ℹ️ $KSU_MANAGER tidak punya nama versi di driver, tidak ada yang diubah."
          fi
        
      - name: "ඞ Inject SUSFS Integration"
        if: ${{ matrix.kernel.enable_ksu == true && env.SUSFS_SUPPORT == 'true' }}
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          SUSFS_COMMIT: ${{ env.SUSFS_COMMIT }}
          SUSFS_BRANCH: gki-android13-5.15
          SUSFS_URL: https://github.com/Codename-riho/Kernel_builder.git
        run: |
          echo "📦 Menyiapkan repositori SUSFS4KSU..."
          clone_susfs() {
            local i
            for i in 1 2 3; do
              rm -rf susfs4ksu
              if [ -n "${SUSFS_COMMIT:-}" ]; then
                echo "Menerapkan SUSFS4KSU pada commit spesifik: $SUSFS_COMMIT"
                if git clone -q -b "$SUSFS_BRANCH" "$SUSFS_URL" susfs4ksu \
                   && git -C susfs4ksu checkout -q "$SUSFS_COMMIT"; then
                  return 0
                fi
              else
                echo "Input commit kosong, mengambil versi terbaru (latest)..."
                if git clone -q --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_URL" susfs4ksu; then
                  return 0
                fi
              fi
              echo "⚠️ Clone SUSFS4KSU gagal ($i/3)"
              sleep $((i * 5))
            done
            return 1
          }
          clone_susfs || { echo "::error::Gagal clone/checkout SUSFS4KSU"; exit 1; }
          SUSFS_HEAD=$(git -C susfs4ksu rev-parse --short HEAD)
          echo "SUSFS4KSU @ $SUSFS_HEAD"

          SUSFS_KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"

          echo "👾 Applying namespace.c Fake Patch (if applicable)"
          NS_FAKE_PATCHED=0
          if ! grep -q '^ #include <trace/hooks/blk.h>$' "$SUSFS_KERNEL_PATCH" \
             && grep -q '^#include <trace/hooks/blk.h>$' fs/namespace.c; then
            sed -i '/^#include <trace\/hooks\/blk.h>$/d' fs/namespace.c
            NS_FAKE_PATCHED=1
          else
            echo "ℹ️ namespace.c: fake patch dilewati"
          fi

          echo "👾 Applying task_mmu.c Fake Patch (if applicable)"
          MM_FAKE_PATCHED=0
          if ! grep -q '^ #include <trace/hooks/mm.h>$' "$SUSFS_KERNEL_PATCH" \
             && grep -q '^#include <trace/hooks/mm.h>$' fs/proc/task_mmu.c; then
            sed -i '/^#include <trace\/hooks\/mm.h>$/d' fs/proc/task_mmu.c
            MM_FAKE_PATCHED=1
          else
            echo "ℹ️ task_mmu.c: fake patch dilewati"
          fi
           
          KVER=$(awk '/^(VERSION|PATCHLEVEL|SUBLEVEL) =/{print $3}' Makefile | head -3 | paste -sd.)
          echo "🧪 Dry-run SUSFS kernel patch terhadap kernel ${KVER}..."

          DRY_LOG=$(patch -p1 --dry-run < "$SUSFS_KERNEL_PATCH" 2>&1) && DRY_RC=0 || DRY_RC=$?
          echo "$DRY_LOG"

          N_FILES=$(echo "$DRY_LOG" | grep -c '^checking file' || true)
          N_OFFSET=$(echo "$DRY_LOG" | grep -c 'offset' || true)
          N_FUZZ=$(echo "$DRY_LOG" | grep -c 'fuzz' || true)
          N_FAIL=$(echo "$DRY_LOG" | grep -c 'FAILED' || true)

          echo "──────── Hasil kecocokan SUSFS ────────"
          echo "Kernel : ${KVER}"
          echo "File   : ${N_FILES} dicek | offset: ${N_OFFSET} | fuzz: ${N_FUZZ} | gagal: ${N_FAIL}"

          if [ "$DRY_RC" = "0" ]; then
            echo "✅ SUSFS COCOK dengan kernel ${KVER}"
            echo "::notice::SUSFS cocok dengan kernel ${KVER} (offset=${N_OFFSET}, fuzz=${N_FUZZ})"
          else
            echo "❌ SUSFS TIDAK COCOK dengan kernel ${KVER}. File yang bermasalah:"
            echo "$DRY_LOG" | awk '/^checking file/{f=$3} /FAILED/{print "   - " f ": " $0}'
            echo "::warning::SUSFS tidak cocok dengan kernel ${KVER} (${N_FAIL} hunk gagal)"
          fi
          echo "───────────────────────────────────────"
          
          echo "💉 Applying SUSFS kernel patch..."
          if patch -p1 < "$SUSFS_KERNEL_PATCH"; then
            echo "✅ SUSFS patch successfully applied"
          else
            echo "⚠️ SUSFS patch failed — copying files manually"
            echo "🩹 Patch punya reject — menerapkan hunk include-only secara manual"

            # namespace.c: hanya 2 hunk (include susfs_def.h + CL_COPY_MNT_NS)
            if [ -f fs/namespace.c.rej ] && [ "$(grep -c '^@@' fs/namespace.c.rej)" -le 2 ]; then
              if ! grep -q 'CL_COPY_MNT_NS BIT(25)' fs/namespace.c; then
                perl -0pi -e 's{(#include "internal\.h"\n)}{$1#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n}' fs/namespace.c
                perl -0pi -e 's{(/\* Maximum number of mounts in a mount namespace \*/\n)}{#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n$1}' fs/namespace.c
              fi
              grep -q 'CL_COPY_MNT_NS BIT(25)' fs/namespace.c || { echo "❌ namespace.c manual inject failed"; exit 1; }
              rm -f fs/namespace.c.rej fs/namespace.c.orig
            fi

            # task_mmu.c: hanya 1 hunk (include susfs_def.h)
            if [ -f fs/proc/task_mmu.c.rej ] && [ "$(grep -c '^@@' fs/proc/task_mmu.c.rej)" -le 1 ]; then
              if ! grep -q 'linux/susfs_def.h' fs/proc/task_mmu.c; then
                perl -0pi -e 's{(#include <asm/elf\.h>\n)}{#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif\n\n$1}' fs/proc/task_mmu.c
              fi
              grep -q 'linux/susfs_def.h' fs/proc/task_mmu.c || { echo "❌ task_mmu.c manual inject failed"; exit 1; }
              rm -f fs/proc/task_mmu.c.rej fs/proc/task_mmu.c.orig
            fi

            # sisa reject selain mkcompile_h = patch benar-benar tidak cocok
            if find . -name '*.rej' ! -name 'mkcompile_h.rej' | grep -q .; then
              echo "❌ Unexpected rejects remain"
              find . -name '*.rej' ! -name 'mkcompile_h.rej' | while read -r r; do
                echo "=== $r ==="; cat "$r"
              done
              exit 1
            fi
            echo "✅ SUSFS patch applied (with manual include fixups)"
          fi
                 
          echo "💉 Applying SUSFS -> KernelSU patch..."
          KSU_PATCH="susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          
          echo "🏹 Forcing SUSFS source injection..."
          
          # Always replace fs/susfs.c
          mkdir -p fs
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          echo "✅ Copied fs/susfs.c"

          # tandai 2 fungsi helper agar tidak dianggap "unused"
          sed -i -E \
            -e 's/^static struct cred \*susfs_switch_to_ksu_domain\(void\)/static __maybe_unused struct cred *susfs_switch_to_ksu_domain(void)/' \
            -e 's/^static void susfs_restore_creds\(/static __maybe_unused void susfs_restore_creds(/' \
            fs/susfs.c

          if [ "$(grep -cE '__maybe_unused.*(susfs_switch_to_ksu_domain|susfs_restore_creds)' fs/susfs.c)" -eq 2 ]; then
            echo "✅ Unused functions marked as used"
          else
            echo "::error::Gagal menandai fungsi unused di fs/susfs.c"
            exit 1
          fi
          
          # Always replace include/linux/susfs.h
          mkdir -p include/linux
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          echo "✅ Copied include/linux/susfs.h"
          
          # Also install missing susfs_def.h
          if [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ]; then
            cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
            echo "✅ Copied include/linux/susfs_def.h"
          else
            echo "⚠️ susfs_def.h not found in repo"
          fi
          
          echo "🔍 Verifying SUSFS files..."
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "✔ Found: $f"; else echo "❌ Missing: $f"; fi
          done
          
          # Clean up SUSFS repo (we only needed kernel patches, not KSU integration)
          rm -rf susfs4ksu
          
          # Create symbolic link for drivers/kernelsu (if needed by build system)
          if [ ! -L "drivers/kernelsu" ]; then
            ln -sf ../KernelSU drivers/kernelsu
            echo "✅ Created drivers/kernelsu symlink"
          fi

          echo "✅ SUSFS build wiring verified"

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          EOF

          echo "↩️ Reverting namespace.c Fake Patch (if applicable)"
          if [ "$NS_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/blk.h' fs/namespace.c; then
            if grep -q '^#include "internal.h"$' fs/namespace.c; then
              sed -i '/^#include "internal.h"$/a #include <trace/hooks/blk.h>' fs/namespace.c
              echo "✔ Restored blk.h include"
            else
              echo "⚠️ Anchor #include \"internal.h\" not found — could not restore blk.h include, check fs/namespace.c manually"
            fi
          else
            echo "ℹ️ Skipping blk.h restore (not fake-patched or already present)"
          fi

          echo "↩️ Reverting task_mmu.c Fake Patch (if applicable)"
          if [ "$MM_FAKE_PATCHED" = "1" ] && ! grep -q 'trace/hooks/mm.h' fs/proc/task_mmu.c; then
            if grep -q '^#include <linux/pkeys.h>$' fs/proc/task_mmu.c; then
              sed -i '/^#include <linux\/pkeys.h>$/a #include <trace/hooks/mm.h>' fs/proc/task_mmu.c
              echo "✔ Restored mm.h include"
            else
              echo "⚠️ Anchor #include <linux/pkeys.h> not found — could not restore mm.h include, check fs/proc/task_mmu.c manually"
            fi
          else
            echo "ℹ️ Skipping mm.h restore (not fake-patched or already present)"
          fi
          
          echo "✅ KSU configs added"
          
          echo "🎉 SUSFS Integration setup complete! (hmm SUS ඞ )"

          # ── Cek simbol hook SUSFS dan KSU (hanya peringatan, tidak menggagalkan build) ──
          (
          set +e
          set -u
          KSU_DIR="${KSU_DIR:-drivers/kernelsu}"
          MISSING=0; TOTAL=0
          for s in ksu_preinit_handle_post_execveat ksu_setup_preinit_file my_setprocattr my_write_context my_write_access; do
            TOTAL=$((TOTAL+1))
            CALLED=$(grep -rnw --include='*.c' --include='*.h' "$s" fs security kernel include 2>/dev/null | grep -v 'include/linux/susfs')
            DEF=$(grep -rnw "$s" "$KSU_DIR" 2>/dev/null)
            NC=$(printf '%s' "$CALLED" | grep -c .)
            ND=$(printf '%s' "$DEF" | grep -c .)
            if [ "$ND" -gt 0 ]; then
              echo "✅ $s (kernel: $NC, KSU: $ND)"
            elif [ "$NC" -gt 0 ]; then
              echo "❌ $s dipanggil di $(printf '%s' "$CALLED" | head -1 | cut -d: -f1,2), tidak ada di KSU"
              MISSING=$((MISSING+1))
            else
              echo "➖ $s (tidak dipakai kernel)"
            fi
          done
          echo "Hilang: $MISSING/$TOTAL | ksu_selinux_hide_running: $(grep -c ksu_selinux_hide_running security/selinux/hooks.c 2>/dev/null)"
          [ "$MISSING" -eq 0 ] || echo "::warning::Ada hook SUSFS di kernel yang tidak punya pasangan di KSU, link akan gagal"
          )

      - name: "💉 Safe-mode inject PRIORITY_UID_FILTER"
        if: matrix.kernel.enable_ksu == true
        shell: bash
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          DEFCONFIG_NAME: ${{ env.DEFCONFIG_NAME }}
        run: |
          set -euo pipefail
          SYM="KSU_SUSFS_PRIORITY_UID_FILTER"
          KCONF="$(readlink -f drivers/kernelsu/Kconfig 2>/dev/null || true)"
          DEFCONFIG="arch/arm64/configs/${DEFCONFIG_NAME}"

          if [ ! -f "$KCONF" ] || ! grep -q '^config KSU_SUSFS$' "$KCONF"; then
            echo "::warning::SUSFS tidak ada di Kconfig KSU, injeksi ${SYM} dilewati"; exit 0
          fi

          if grep -q "^config ${SYM}\$" "$KCONF"; then
            echo "ℹ️ ${SYM} sudah dideklarasikan oleh patch"
          else
            tmp="$(mktemp)"
            awk -v sym="$SYM" '
              /^menu "KernelSU - SUSFS"/ { insus=1 }
              insus && /^endmenu/ && !done {
                print "config " sym
                print "\tbool \"Enable priority uid filter for SUSFS\""
                print "\tdepends on KSU_SUSFS"
                print "\tdefault y"
                print "\thelp"
                print "\t  Manual injection (workflow safe mode)."
                print ""
                done=1; insus=0
              }
              { print }
              END { exit(done ? 0 : 3) }
            ' "$KCONF" > "$tmp" || { rm -f "$tmp"; echo "::warning::menu SUSFS tidak ditemukan, injeksi dibatalkan"; exit 0; }
            cat "$tmp" > "$KCONF"; rm -f "$tmp"
            echo "💉 Deklarasi ${SYM} disuntikkan ke Kconfig KSU"
          fi

          grep -q "^CONFIG_${SYM}=y" "$DEFCONFIG" || echo "CONFIG_${SYM}=y" >> "$DEFCONFIG"

          if grep -rIq "CONFIG_${SYM}" drivers/kernelsu/ fs/ include/linux/ 2>/dev/null; then
            echo "✅ Source mereferensikan CONFIG_${SYM}"
          else
            echo "ℹ️ Source tidak mereferensikan CONFIG_${SYM}: fitur kemungkinan selalu terkompilasi (tanpa gate)"
          fi
                          
      - name: "📝 Append custom Makefile line"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          # cc-disable-warning: flag -Wno-* hanya dipasang jika compiler mengenalnya
          # (clang lama seperti ZyC 14 tidak punya dua flag pertama)
          if [ "$TOOLCHAIN_TYPE" = "custom-tools" ]; then
            printf '%s\n' \
              'KBUILD_CFLAGS += $(call cc-disable-warning,default-const-init-unsafe)' \
              'KBUILD_CFLAGS += $(call cc-disable-warning,uninitialized-const-pointer)' \
              'KBUILD_CFLAGS += -Wno-implicit-function-declaration' \
              'KBUILD_CFLAGS += -Wno-sometimes-uninitialized' >> Makefile
          else
            echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile
          fi
          # Tool host (dtc): redam peringatan clang baru. Harus KBUILD_HOSTCFLAGS, bukan HOSTCFLAGS.
          echo 'KBUILD_HOSTCFLAGS += -Wno-unused-but-set-global' >> Makefile
          
          echo "✅ Flag Makefile ($TOOLCHAIN_TYPE) ditambahkan"

      - name: "✍️ Set kernel identity (localversion + build by/host)"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          # ── Localversion pendek tetap (abaikan git tag/dirty) ──
          VER="${{ env.LOCAL_VERSION }}-${{ env.BUILD_TIME }}"
          cat > scripts/setlocalversion << EOF
          #!/bin/sh
          # Cryo: fixed short localversion (ignore git tags/dirty)
          printf '%s' "$VER"
          EOF
          chmod +x scripts/setlocalversion
          rm -f .scmversion localversion*
          echo "Localversion: $VER"

          # ── Compile by/host ──
          BY_VAL="Dyatz-Snezhnaya"
          HOST_VAL="GitHub-Ubuntu"
          F=scripts/mkcompile_h
          [ -f "$F" ] || { echo "::error::$F tidak ditemukan"; exit 1; }

          # $1 = BY|HOST, $2 = nilai yang diinginkan
          set_identity() {
            local key="LINUX_COMPILE_$1" val="$2"
            local want="^[[:space:]]*${key}=\"${val}\"\$"

            grep -qE "^[[:space:]]*${key}=" "$F" \
              || { echo "::error::${key} tidak ada di $F"; exit 1; }

            if grep -qE "$want" "$F"; then
              echo "⏭️ ${key} sudah \"${val}\", dilewati"
              return 0
            fi

            sed -i -E "s/^([[:space:]]*)${key}=.*/\1${key}=\"${val}\"/" "$F"
            grep -qE "$want" "$F" \
              || { echo "::error::Gagal mengubah ${key}"; exit 1; }
            echo "✅ ${key} diubah ke \"${val}\""
          }

          set_identity BY   "$BY_VAL"
          set_identity HOST "$HOST_VAL"

          # Bukti hasil akhir
          grep -nE "LINUX_COMPILE_(BY|HOST)" "$F"

      - name: "⚖️ Set CPU Governor to Enhance walt"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          CONFIG_PATH="arch/arm64/configs/${DEFCONFIG_NAME}"
          [ -f "$CONFIG_PATH" ] || die "Defconfig tidak ditemukan: $CONFIG_PATH"

          # Cek apakah simbol ada di Kconfig tree ini (hindari baris sampah "is not set")
          has_sym() {
            grep -rqsE "^config ${1#CONFIG_}\$" --include='Kconfig*' drivers/cpufreq init kernel/sched
          }

          echo "⚙️ Mengatur CPU Governor default ke 'schedutil'..."

          # 1. Build walt + uclamp (dipakai Android untuk boost app aktif)
          scripts/config --file "$CONFIG_PATH" \
            -e CONFIG_CPU_FREQ_GOV_WALT \
            -d CONFIG_CPU_FREQ_GOV_SCHEDUTIL \
            -e CONFIG_UCLAMP_TASK \
            -e CONFIG_UCLAMP_TASK_GROUP

          # 2. Matikan default governor lain (hanya yang memang ada di tree ini)
          for g in PERFORMANCE POWERSAVE USERSPACE ONDEMAND CONSERVATIVE INTERACTIVE SCHEDUTIL; do
            if has_sym "CONFIG_CPU_FREQ_DEFAULT_GOV_${g}"; then
              scripts/config --file "$CONFIG_PATH" -d "CONFIG_CPU_FREQ_DEFAULT_GOV_${g}"
            fi
          done

          # 3. Jadikan walt sebagai governor default
          scripts/config --file "$CONFIG_PATH" -e CONFIG_CPU_FREQ_DEFAULT_GOV_WALT
          
          
      - name: "🛡️ Guard VINTF"
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          set -euo pipefail

          CFG="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          FORBIDDEN=(IP6_NF_NAT IP6_NF_TARGET_MASQUERADE)
          failed=()

          [ -f "$CFG" ] || { echo "::error::Defconfig tidak ditemukan: $CFG"; exit 1; }

          echo "::group::🔍 Guard VINTF ($CFG)"
          for o in "${FORBIDDEN[@]}"; do
            scripts/config --file "$CFG" -d "CONFIG_${o}"
            if grep -Eq "^CONFIG_${o}=(y|m)" "$CFG"; then
              echo "  ❌ CONFIG_${o} masih aktif"
              failed+=("CONFIG_${o}")
            else
              echo "  ✅ CONFIG_${o} nonaktif"
            fi
          done
          echo "::endgroup::"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Guard VINTF gagal, masih aktif: ${failed[*]}"
            exit 1
          fi

          echo "✅ Guard VINTF lolos: IPv6 NAT/Masquerade nonaktif"

      - name: 🌡️ Patch thermal bind clamp
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        run: |
          python3 - <<'EOF'
          path = "drivers/thermal/thermal_core.c"
          print(f"🔍 Membaca {path}...")

          with open(path) as f:
              src = f.read()

          old = ("\tif (lower > upper || upper > max_state)\n"
                 "\t\treturn -EINVAL;\n")

          new = ("\tif (upper > max_state)\n"
                 "\t\tupper = max_state;\n"
                 "\tif (lower > upper)\n"
                 "\t\tlower = upper;\n")

          assert src.count(old) == 1, "❌ pattern not found / tidak unik"

          with open(path, "w") as f:
              f.write(src.replace(old, new, 1))

          print("✅ Patch thermal clamp berhasil diterapkan!")
          EOF
                      
      - name: "🔨 Build kernel (android-tools)"
        if: ${{ env.TOOLCHAIN_TYPE == 'android-tools' }}
        working-directory: ${{ env.WORK_DIR }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          ENABLE_KSU: ${{ matrix.kernel.enable_ksu }}
          VARIANT_NAME: ${{ matrix.kernel.name }}
          PYTHONWARNINGS: ignore::SyntaxWarning
        run: |
          set -o pipefail
          trap 'echo "💾 Sisa disk:"; df -h / | tail -n 1' EXIT

          LTO=full \
          BUILD_CONFIG=${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all) 2>&1 | tee build_full.log

          # ── Cek .config akhir ──
          set -u
          CONFIG_OUT=$(find out -maxdepth 5 -type f -name .config -print -quit 2>/dev/null || true)
          if [ -z "$CONFIG_OUT" ]; then
            echo "::warning::.config hasil build.sh tidak ditemukan di out/"
            exit 0
          fi
          echo "Membaca $CONFIG_OUT"

          CHECK_LIST="CONFIG_LTO_CLANG_FULL CONFIG_TCP_CONG_BBR3 CONFIG_ZRAM_DEF_COMP_LZ4 CONFIG_CRYPTO_LZO CONFIG_DEBUG_INFO_BTF"
          if [ "$ENABLE_KSU" = "true" ]; then
            CHECK_LIST="$CHECK_LIST CONFIG_KSU"
            [ "${KSU_MANAGER:-}" = "SukiSU-Ultra+KPM" ] && CHECK_LIST="$CHECK_LIST CONFIG_KPM"
          fi
          ENABLED=" $({ grep -E '^CONFIG_[A-Za-z0-9_]+=y$' "$CONFIG_OUT" || true; } | cut -d= -f1 | tr '\n' ' ') "

          CHECK_FILE="$WORK_DIR/config_check.txt"
          : > "$CHECK_FILE"
          for c in $CHECK_LIST; do
            case "$ENABLED" in
              *" $c "*) echo "$VARIANT_NAME $c ok" >> "$CHECK_FILE"; echo "  ✔ $c=y" ;;
              *)        echo "$VARIANT_NAME $c miss" >> "$CHECK_FILE"
                        echo "::warning::[$VARIANT_NAME] $c tidak aktif di .config akhir" ;;
            esac
          done
          
      - name: "🎶 Build kernel (custom-tools)"
        if: ${{ env.TOOLCHAIN_TYPE == 'custom-tools' }}
        working-directory: ${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}
        env:
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          ENABLE_KSU: ${{ matrix.kernel.enable_ksu }}
          SUSFS_SUPPORT: ${{ env.SUSFS_SUPPORT }}
          VARIANT_NAME: ${{ matrix.kernel.name }}
          PYTHONWARNINGS: ignore::SyntaxWarning
        run: |
          set -euo pipefail
          trap 'echo "💾 Sisa disk:"; df -h / | tail -n 1' EXIT
          clang --version | head -n1
          make ARCH=arm64 LLVM=1 O=out "$DEFCONFIG_NAME"
          # samakan dengan jalur build.sh (LTO=full)
          scripts/config --file out/.config -d LTO_CLANG_THIN -e LTO_CLANG_FULL
          make ARCH=arm64 LLVM=1 O=out olddefconfig

          # Pastikan config penting tidak hilang setelah resolusi dependensi
          CHECK_LIST="CONFIG_LTO_CLANG_FULL CONFIG_TCP_CONG_BBR3 CONFIG_ZRAM_DEF_COMP_LZ4 CONFIG_CRYPTO_LZO"
          if [ "$ENABLE_KSU" = "true" ]; then
            CHECK_LIST="$CHECK_LIST CONFIG_KSU"
            [ "${KSU_MANAGER:-}" = "SukiSU-Ultra+KPM" ] && CHECK_LIST="$CHECK_LIST CONFIG_KPM"
            [ "${SUSFS_SUPPORT:-}" = "true" ] && CHECK_LIST="$CHECK_LIST CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER"
          fi

          # Baca .config sekali saja: daftar semua opsi yang bernilai =y
          ENABLED=" $({ grep -E '^CONFIG_[A-Za-z0-9_]+=y$' out/.config || true; } | cut -d= -f1 | tr '\n' ' ') "

          # Catat hasil (format: varian CONFIG ok|miss); dirangkum satu kali di job "Package Kernels"
          CHECK_FILE="$WORK_DIR/config_check.txt"
          : > "$CHECK_FILE"
          for c in $CHECK_LIST; do
            case "$ENABLED" in
              *" $c "*) echo "$VARIANT_NAME $c ok" >> "$CHECK_FILE"; echo "  ✔ $c=y" ;;
              *)        echo "$VARIANT_NAME $c miss" >> "$CHECK_FILE"
                        echo "::warning::[$VARIANT_NAME] $c tidak aktif di .config akhir" ;;
            esac
          done

          # Diagnosa ZRAM/LZ4: hanya dicetak kalau LZ4 tidak aktif
          case "$ENABLED" in
            *" CONFIG_ZRAM_DEF_COMP_LZ4 "*) ;;
            *)
              echo "::group::Diagnosa ZRAM/LZ4"
              echo "== ZRAM/LZ4 di .config"
              grep -nE 'CONFIG_ZRAM([= ]|_DEF)|CONFIG_CRYPTO_LZ4' out/.config || echo "(tidak ada entri ZRAM/LZ4 sama sekali)"
              echo "== Kconfig zram"
              grep -n -B1 -A3 'ZRAM_DEF_COMP_LZ4' drivers/block/zram/Kconfig 2>/dev/null || echo "(ZRAM_DEF_COMP_LZ4 tidak ada di Kconfig tree ini)"
              echo "::endgroup::"
              ;;
          esac

          # ── Build ──
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc --all)" Image 2>&1 | tee "$WORK_DIR/build_full.log"
                                  
      - name: "🚨 Kumpulkan Log Error (Jika Gagal)"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: error-logs-${{ matrix.kernel.name }}
          path: |
            ${{ env.WORK_DIR }}/build_full.log
            ${{ env.WORK_DIR }}/out/.config
            ${{ env.WORK_DIR }}/${{ env.KERNEL_LOC_DIR }}/${{ env.KERNEL_NAME }}/*.rej
          retention-days: 3
          if-no-files-found: ignore

      - name: "📤 Upload hasil cek konfigurasi"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-check-${{ matrix.kernel.name }}
          path: |
            ${{ env.WORK_DIR }}/config_check.txt
            ${{ env.WORK_DIR }}/ksu_info.txt
            ${{ env.WORK_DIR }}/deepsleep_info.txt
          retention-days: 1
          if-no-files-found: ignore
          
      - name: "📦 Prepare kernel image"
        working-directory: ${{ env.WORK_DIR }}
        run: |
           set -euo pipefail
           mkdir -p out/dist
           if [ "$TOOLCHAIN_TYPE" = "custom-tools" ]; then
             # If CLANG_PATH was set earlier in this job it will be available
             if [ -n "${CLANG_PATH:-}" ]; then
               echo "custom-tools ($(basename "$CLANG_PATH"))" > out/dist/build_tools.txt
             else
               # fallback: try system clang
               clang --version 2>/dev/null | head -n1 > out/dist/build_tools.txt || echo "custom-tools (unknown clang)" > out/dist/build_tools.txt
             fi
           else
             echo "android-tools (clang-r614150)" > out/dist/build_tools.txt
           fi

           if [ "$TOOLCHAIN_TYPE" = "custom-tools" ]; then
             src="${KERNEL_LOC_DIR}/${KERNEL_NAME}/out/arch/arm64/boot/Image"
           else
             src="out/dist/Image"        # hasil build/build.sh
           fi
           [ -f "$src" ] || { echo "::error::Image tidak ditemukan: $src"; exit 1; }
           cp "$src" "out/dist/${OUTPUT_NAME}"
           ls -lh "out/dist/${OUTPUT_NAME}"
           # show build_tools for debugging
           echo "Build tools recorded:"
           cat out/dist/build_tools.txt || true
           
      - name: "📤 Upload kernel artifact"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.kernel.name }}-kernel
          path: ${{ env.WORK_DIR }}/out/dist/${{ env.OUTPUT_NAME }}
          retention-days: 1

      - name: 🔍 Check Space (Post-Build)
        if: always() # Run even if build fails to debug space issues
        run: |
          echo "Final disk space status:"
          df -h /
               
  package-kernels:
    name: "📦 Package Kernels"
    runs-on: ubuntu-26.04
    needs: [build-kernels]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: "📥 Download kernel artifacts"
        if: needs.build-kernels.result == 'success'
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts/

      - name: "🧩 Ringkasan konfigurasi kernel"
        if: needs.build-kernels.result == 'success'
        run: |
          VARIANTS=$(find ./artifacts -mindepth 1 -maxdepth 1 -type d -name '*-kernel' -printf '%f\n' 2>/dev/null \
            | sed 's/-kernel$//' | sort | paste -sd, - | sed 's/,/, /g')
          CHECKS=$(find ./artifacts -type f -name config_check.txt 2>/dev/null | sort)
          KSU_INFOS=$(find ./artifacts -type f -name ksu_info.txt 2>/dev/null | sort)
          DS_INFOS=$(find ./artifacts -type f -name deepsleep_info.txt 2>/dev/null | sort)
          {
            # ── 1. Cek .config akhir ──────────────────────────────────────────
            echo "### 🧩 Kernel Configuration"
            if [ -z "$CHECKS" ]; then
              echo "✅ Konfigurasi berhasil diterapkan: ${VARIANTS:-tidak ada varian terdeteksi}"
            else
              # shellcheck disable=SC2086
              cat $CHECKS | awk -v variants="$VARIANTS" '
                { v[$1]=1; k=$2
                  if (!(k in seen)) { seen[k]=1; order[++n]=k }
                  cnt[k]++
                  if ($3=="ok") { ok[k]=ok[k] (ok[k]==""?"":", ") $1 }
                  else          { miss[k]=miss[k] (miss[k]==""?"":", ") $1 }
                }
                END {
                  for (x in v) total++
                  bad=0; for (i=1;i<=n;i++) if (miss[order[i]]!="") bad=1
                  if (bad) print "⚠️ Ada konfigurasi yang tidak aktif: " variants
                  else     print "✅ Konfigurasi berhasil diterapkan: " variants
                  print ""
                  for (i=1;i<=n;i++) { k=order[i]
                    if (miss[k]!="")        print "- ⚠️ `" k "` tidak aktif di: " miss[k]
                    else if (cnt[k]<total)  print "- ✅ `" k "=y` (" ok[k] ")"
                    else                    print "- ✅ `" k "=y`"
                  }
                }'
            fi

            # ── 2. Detail KSU (varian dengan nilai sama digabung satu baris) ──
            if [ -n "$KSU_INFOS" ]; then
              echo
              echo "### 🔑 KernelSU"
              # shellcheck disable=SC2086
              cat $KSU_INFOS | awk -F'|' '
                { key=$2 "|" $3 "|" $4 "|" $5 "|" $6 "|" $7
                  if (!(key in vars)) order[++n]=key
                  vars[key]=vars[key] (vars[key]==""?"":", ") $1 }
                END {
                  print "| Varian | Manager | Ref | Versi | KPM | SUSFS | Patch ekstra |"
                  print "|---|---|---|---|---|---|---|"
                  for (i=1;i<=n;i++) { split(order[i], p, "|")
                    printf "| %s | %s | %s | %s | %s | %s | %s |\n", vars[order[i]], p[1], p[2], p[3], (p[4]==""?"—":p[4]), p[5], p[6] }
                }'
            fi

          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: "📦 Create release package"
        if: needs.build-kernels.result == 'success'
        run: |
          set -e

          # Clone AnyKernel3
          git clone --depth=1 https://github.com/Codename-riho/AnyKernel3.git -b master AnyKernel3

          # Copy kernel images
          find ./artifacts -name "Image.*" -exec cp {} AnyKernel3/ \;
          ls AnyKernel3/Image.*
          
          # Create banner             
          cat > AnyKernel3/banner << 'EOF'
          +--------------------- * - + - * ---------------------+
          |                                                     |
          |                           __                        |
          |                           ##                        |
          |                          ####                       |
          |                         ##""##                      |
          |                        ##"  "##                     |
          |          ___           ##_  _##           ___       |
          |          "#########_    "####"    _#########"       |
          |            ##_   "##_    "##"    _##"   _##         |
          |             "##_   ##_  _ ## _  _##   _##"          |
          |               ########__######__########            |
          |                       _########_                    |
          |                       "########"                    |
          |               ########""######""########            |
          |             _##"   ##"  " ## "  "##   "##_          |
          |            ##"   _##"    _##_    "##_   "##         |
          |          _#########"    _####_    "#########_       |
          |          """           ##"  "##           """       |
          |                        ##_  _##                     |
          |                         ##__##                      |
          |                          ####                       |
          |                           ##                        |
          |                           ""                        |
          |                                                     |
          |                C R Y O   K E R N E L                |
          |   -----*  Forged in the cold of Snezhnaya  *-----   |
          |                    by Dyatzhya❄️                    |
          |                                                     |
          +--------------------- * - + - * ---------------------+
          |                                                     |
          |  * CRYO AUTHORITY ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ |
          |   • Full LTO + Tick Rate 250 HZ                     |
          |   • Extra TCP Congestion With BBR v3 Support        |
          |   • Seasoned Stock Kernel                           |
          |                                                     |
          |  * E.T.I.R (TOOLCHAIN) ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~|
          |   • Custom Clang  / AOSP Clang r614150              |
