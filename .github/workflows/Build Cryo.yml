      - name: "📤 Upload kernel ZIP artifact"
        if: needs.build-kernels.result == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: CryoKernel-AK3-${{ steps.package.outputs.date_wib }}
          path: ${{ env.ZIP_NAME }}
          archive: false
          retention-days: 30
          if-no-files-found: error
          
      - name: "📱 Send to Telegram"
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-kernels.result }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_IMAGE_URL: ${{ secrets.TELEGRAM_IMAGE_URL }}
          KERNEL_VARIANT: ${{ inputs.kernel_variant || 'all' }}
          KSU_MANAGER: ${{ inputs.ksu_manager || 'BakaSU' }}
          KSU_REF: ${{ inputs.ksu_ref }}
          SUSFS_SUPPORT: ${{ format('{0}', inputs.susfsSupport) == 'false' && 'false' || 'true' }}
          SUSFS_COMMIT: ${{ inputs.susfs_commit }}
          DROIDSPACES_SUPPORT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.droidspaces_support) != 'false' && 'true' || 'false' }}
          TOOLCHAIN_TYPE: ${{ inputs.toolchain_type || 'android-tools' }}
          CUSTOM_CLANG_REPO: ${{ inputs.customClangRepo }}
          DEVICE_NAME: "Redmi Note 12 4G"
          SPOOF_INPUT: ${{ inputs.kernelSpoofVersion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          set +e   # notifikasi tidak boleh menggagalkan workflow
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_USER_ID:-}" ]; then
            echo "::notice::Secret Telegram belum diisi, notifikasi dilewati"; exit 0
          fi
          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          tg_send() {
            local text="$1" len resp
            len=$(printf '%s' "$text" | sed -e 's/<[^>]*>//g' | wc -m)
            if [ -n "${TELEGRAM_IMAGE_URL:-}" ] && [ "$len" -le 1000 ]; then
              resp=$(curl -sS "$API/sendPhoto" \
                --data-urlencode "chat_id=${TELEGRAM_USER_ID}" \
                --data-urlencode "photo=${TELEGRAM_IMAGE_URL}" \
                --data-urlencode "caption=${text}" \
                --data-urlencode "parse_mode=HTML")
              if echo "$resp" | jq -e '.ok' >/dev/null 2>&1; then echo "✅ Telegram terkirim (foto)"; return 0; fi
              echo "::warning::sendPhoto ditolak: $(echo "$resp" | jq -r '.description // empty' 2>/dev/null). Coba kirim teks."
            fi
            resp=$(curl -sS "$API/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_USER_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode 'link_preview_options={"is_disabled":true}' \
              --data-urlencode "text=${text}")
            if echo "$resp" | jq -e '.ok' >/dev/null 2>&1; then echo "✅ Telegram terkirim (teks)"; return 0; fi
            echo "::warning::Telegram menolak pesan: $(echo "$resp" | jq -r '.description // empty' 2>/dev/null)"; return 1
          }

          # ── Teks konfigurasi (dipakai pesan sukses & gagal) ──
          if [ "$SUSFS_SUPPORT" = "false" ]; then
            SUSFS_TEXT="Disabled"
          else
            SC=$(printf '%s' "${SUSFS_COMMIT:-latest}" | cut -c1-7 | esc)
            SUSFS_TEXT="Enabled (GKI A13-5.15, ${SC})"
          fi
          if [ "$DROIDSPACES_SUPPORT" = "false" ]; then 
            DROIDSPACES_TEXT="Disabled"; 
            else 
            DROIDSPACES_TEXT="Enabled Proper Working"; fi

          case "$KERNEL_VARIANT" in
            ksu-gki)   VARIANT_TEXT="KSU (GKI)" ;;
            ksu-clo)   VARIANT_TEXT="KSU (CLO)" ;;
            noksu-gki) VARIANT_TEXT="NoKSU (GKI)" ;;
            noksu-clo) VARIANT_TEXT="NoKSU (CLO)" ;;
            ksu-all)   VARIANT_TEXT="KSU (GKI + CLO)" ;;
            noksu-all) VARIANT_TEXT="NoKSU (GKI + CLO)" ;;
            *)         VARIANT_TEXT="KSU + NoKSU (GKI + CLO, semua varian)" ;;
          esac

          MANAGER=$(printf '%s' "$KSU_MANAGER${KSU_REF:+ @ $KSU_REF}" | esc)
          
          KVER_SHOW="${KERNEL_VERSION}"
          [ -n "${SPOOF_INPUT:-}" ] && KVER_SHOW="${KERNEL_VERSION} (spoof: $(printf '%s' "$SPOOF_INPUT" | esc))"

          if [ "$TOOLCHAIN_TYPE" = "custom-tools" ]; then
            BUILD_TOOLS="custom-tools (${CUSTOM_CLANG_REPO:-unknown})"
          else
            BUILD_TOOLS="android-tools (clang-r614150)"
          fi
          BT=$(find ./artifacts -type f -name 'build_tools.txt' -print -quit 2>/dev/null)
          [ -n "$BT" ] && BUILD_TOOLS=$(head -n1 "$BT" | tr -d '\r\n')
          BUILD_TOOLS=$(printf '%s' "$BUILD_TOOLS" | esc)

          if [ "$BUILD_RESULT" = "success" ] && [ "$JOB_STATUS" = "success" ]; then
            # ───── SUKSES ─────
            IMAGES=$(cd AnyKernel3 && ls Image.* 2>/dev/null | sed 's/^Image\.//' | paste -sd, - | sed 's/,/, /g')
            # Tanggal localversion = tanggal saat build dimulai (bisa beda dari hari packaging bila lewat tengah malam)
            BD=$(find ./artifacts -type f -name build_date.txt -print -quit 2>/dev/null)
            DATE=""
            [ -z "$BD" ] || DATE=$(head -n1 "$BD" | tr -d '\r\n')
            [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || DATE=$(TZ=Asia/Jakarta date +'%Y-%m-%d')

            MSG="✅ <b>Kernel Build Successful</b>

          <b>📦 Build Information:</b>
          • Kernel: <code>Linux ${KVER_SHOW}</code>
          • Android: <code>13-16</code>
          • Branch: <code>android13-5.15-lts</code> (GKI), <code>kernel.lnx.5.15.r16-rel</code> (CLO)
          • Device: <code>${DEVICE_NAME}</code>

          <b>👾 Configuration:</b>
          • LTO: <code>Full</code>
          • Tick Rate: <code>250 Hz</code>
          • Images: <code>${IMAGES}</code>
          • Varian Build: <code>${VARIANT_TEXT}</code>
          • KSU Manager: <code>${MANAGER}</code>
          • SUSFS: <code>${SUSFS_TEXT}</code>
          • Droidspaces: <code>${DROIDSPACES_TEXT}</code>
          • Local Version: <code>Cryo-GKI-${DATE}</code>, <code>Cryo-CLO-${DATE}</code>
          • Build Tools: <code>${BUILD_TOOLS}</code>

          🕐 <b>Build Date:</b> $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')
          📦 <b>Package:</b> <code>${ZIP_NAME}</code>

          🔗 <a href=\"${RUN_URL}\">Unduh dari Artifacts (halaman run)</a>"
          else
            
          # ───── GAGAL ─────
            FAILED=""
            JOBS_JSON=$(curl -fsSL --retry 3 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100") \
              || echo "::warning::Gagal membaca daftar job dari API (cek permission actions: read)"

            # Job/step yang gagal. Job yang sedang berjalan (Package Kernels, tempat step ini berada)
            # belum punya conclusion, jadi step-nya dicek langsung.
            if [ -n "${JOBS_JSON:-}" ]; then
              while IFS=$'\t' read -r job step; do
                [ -n "$job" ] || continue
                FAILED+="• <b>$(printf '%s' "$job" | esc)</b> → <code>$(printf '%s' "$step" | esc)</code>"$'\n'
              done < <(printf '%s' "$JOBS_JSON" | jq -r '
                .jobs[]
                | ([.steps[]? | select(.conclusion=="failure" or .conclusion=="timed_out")][0].name) as $s
                | select(.conclusion=="failure" or .conclusion=="timed_out" or $s != null)
                | [.name, ($s // "(step tidak terbaca, lihat log)")] | @tsv' 2>/dev/null)
            fi

            # Cadangan bila API tidak memberi hasil: pakai status yang sudah diketahui workflow
            if [ -z "$FAILED" ]; then
              [ "$BUILD_RESULT" = "success" ] || FAILED+="• <b>Build Kernels</b> → <code>lihat artifact error-logs-*</code>"$'\n'
              [ "$JOB_STATUS"  = "success" ] || FAILED+="• <b>Package Kernels</b> → <code>lihat log job ini</code>"$'\n'
            fi

            MSG="❌ <b>Kernel Build Failed</b>

          <b>📦 Build Information:</b>
          • Kernel: <code>Linux ${KVER_SHOW}</code>
          • Branch: <code>android13-5.15-lts</code> (GKI), <code>kernel.lnx.5.15.r16-rel</code> (CLO)
          • Device: <code>$(printf '%s' "$DEVICE_NAME" | esc)</code>

          <b>👾 Configuration:</b>
          • Varian Build: <code>${VARIANT_TEXT}</code>
          • KSU Manager: <code>${MANAGER}</code>
          • SUSFS: <code>${SUSFS_TEXT}</code>
          • Droidspaces: <code>${DROIDSPACES_TEXT}</code>
          • Build Tools: <code>${BUILD_TOOLS}</code>

          💥 <b>Gagal di:</b>
          ${FAILED}
          🕐 <b>Build Date:</b> $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')
          🔍 Cek <a href=\"${RUN_URL}\">workflow logs</a> (artifact <code>error-logs-*</code> berisi build_full.log)"
          fi

          tg_send "$MSG"
          exit 0
          
