name: "Transfer Kernel Source"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "URL Repo Sumber (Contoh: https://github.com/LineageOS/android_kernel_xiaomi_sm6225)"
        required: true
        type: string
      source_branch:
        description: "Branch Sumber (Contoh: lineage-21)"
        required: true
        type: string
      target_repo:
        description: "Repo Target Anda (Format: username/repo-kernel-saya)"
        required: true
        type: string
      target_branch:
        description: "Branch Target (Contoh: main atau 14)"
        required: true
        type: string
        default: "main"
permissions:
   contents: write
jobs:
  transfer:
    name: "🔄 Transfer Repository"
    runs-on: ubuntu-26.04
    steps:
      - name: "🧹 Bebaskan Ruang Disk (Untuk Kernel Besar)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: 🚧 Setup SWAP 16GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 16
            
      - name: 🔥 Tune Swap
        run: |
            echo "vm.swappiness=85" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "📥 Clone Repository Sumber"
        run: |
          echo "Mengambil branch ${{ inputs.source_branch }} dari ${{ inputs.source_repo }}..."
          
          # Optimasi koneksi Git khusus untuk mencegah timeout
          git config --global http.version HTTP/1.1          
          git config --global http.postBuffer 2147483648   
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          
          # Clone hanya 1 branch yang dibutuhkan agar cepat
          git clone --depth=1 --no-tags --branch ${{ inputs.source_branch }} --single-branch ${{ inputs.source_repo }} kernel-source

      - name: "🚀 Push ke Repository Target (Fresh History)"
        working-directory: ./kernel-source
        run: |
          set -e
          
          echo "Menghapus riwayat Git raksasa bawaan sumber..."
          rm -rf .git
          
          echo "Membuat riwayat Git baru yang 100% bersih..."
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Masukkan semua file kernel ke dalam commit pertama yang segar
          git checkout -b ${{ inputs.target_branch }}
          git add .
          git commit -m "Sync: Source kernel segar dari ${{ inputs.source_repo }}"
          
          # Tambahkan remote repositori target Anda
          git remote add target "https://${{ github.actor }}:${{ github.token }}@github.com/${{ inputs.target_repo }}.git"
          
          echo "Mengunggah (push) ke https://github.com/${{ inputs.target_repo }} pada branch ${{ inputs.target_branch }}..."
          
          # Push paksa (-f) ke repositori Anda
          git push -f -u target ${{ inputs.target_branch }}
          
          echo "✅ Transfer selesai mutlak!"
          
