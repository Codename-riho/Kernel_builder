name: "Transfer Kernel Source"

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "URL Repo Sumber (Contoh: https://github.com/LineageOS/android_kernel_xiaomi_sm6225)"
        required: true
        type: string
      source_branch:
        description: "Branch Sumber (Contoh: lineage-21)"
        required: true
        type: string
      target_repo:
        description: "Repo Target Anda (Format: username/repo-kernel-saya)"
        required: true
        type: string
      target_branch:
        description: "Branch Target (Contoh: main atau 14)"
        required: true
        type: string
        default: "main"
permissions:
   contents: write
jobs:
  transfer:
    name: "🔄 Transfer Repository"
    runs-on: ubuntu-26.04
    steps:
      - name: "🧹 Bebaskan Ruang Disk (Untuk Kernel Besar)"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: "📥 Clone Repository Sumber"
        run: |
          echo "Mengambil branch ${{ inputs.source_branch }} dari ${{ inputs.source_repo }}..."
          
          # Optimasi koneksi Git khusus untuk mencegah timeout
          git config --global http.version HTTP/1.1          
          git config --global http.postBuffer 2147483648   
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 600
          
          # Clone hanya 1 branch yang dibutuhkan agar cepat
          git clone --branch ${{ inputs.source_branch }} --single-branch ${{ inputs.source_repo }} kernel-source

      - name: "🚀 Push ke Repository Target"
        working-directory: ./kernel-source
        env:
          TARGET_PAT: ${{ secrets.TARGET_PAT }}
        run: |
          set -e
          
          # Optimasi memori agar pack-objects tidak kehabisan napas saat kompresi upload
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 2g
          
          # Hapus remote asli agar tidak bentrok
          git remote remove origin
          
          # Konfigurasi identitas git (sebagai bot)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Menggunakan github.token bawaan (tanpa perlu secret)
          git remote add target "https://${{ github.actor }}:${{ github.token }}@github.com/${{ inputs.target_repo }}.git"
          
          echo "Mengunggah (push) ke https://github.com/${{ inputs.target_repo }} pada branch ${{ inputs.target_branch }}..."
          
          # Push ke repo ini
          git push -u target HEAD:${{ inputs.target_branch }}
          
          echo "✅ Transfer selesai!"
          
